packages:
  - apps/*
  - packages/*
allowBuilds:
  "@prisma/engines": true
  esbuild: true
  electron: true
  prisma: true
  argon2: true
minimumReleaseAgeExclude:
  - vite@8.2.2
overrides:
  "@xmldom/xmldom": 0.8.15
  "brace-expansion@^1.0.0": 1.1.21
  "brace-expansion@^2.0.0": 2.1.7
  "brace-expansion@^5.0.0": 5.0.12
  compression: 1.8.2
  deepmerge-ts: 8.0.0
  extract-zip: 2.0.2
  fast-uri: 3.1.8
  "js-yaml@^3.0.0": 3.15.2
  "js-yaml@^4.0.0": 4.3.2
  multer: 2.3.0
  mysql2: 3.22.0
  postcss: 8.5.18
  proxy-addr: 2.0.8
  shell-quote: 1.12.0
  source-map-js: 1.2.2
  tar: 7.5.21
  "undici@^6.0.0": 6.29.0
  "undici@^7.0.0": 7.30.0
auditConfig:
  # Advisories with no fixed release to move to. All three reach only the
  # mobile app's React Native developer tooling, which never ships:
  # - image-size (metro asset sizing): fixed only in 2.x, which drops the
  #   default export metro 0.81 calls.
  # - node-forge (selfsigned, dev server certificate): no release after 1.4.0.
  # - braces (jscodeshift codegen): no release after 3.0.3.
  # Remove each entry once a fixed version is available.
  ignoreGhsas:
    - GHSA-5p2g-fcmc-qvqq
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-86w9-cpqp-85rv
    - GHSA-vfj7-8cjw-p6xm
