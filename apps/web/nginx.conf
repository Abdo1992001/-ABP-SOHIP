server {
  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types application/javascript application/json image/svg+xml text/css text/plain;

  # nginx's add_header does not merge: the moment a location declares one, every
  # header inherited from the server block above is dropped for that location.
  # Each location below therefore repeats the three security headers. Without
  # this the SPA document itself — the one page worth protecting from
  # clickjacking — was served with no X-Frame-Options at all, because
  # `location = /index.html` set a Cache-Control and silently lost the rest.
  location = /runtime-config.js {
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control "no-store";
  }

  location /api/ {
    # No gzip on the API.
    #
    # nginx weakens an ETag when it compresses the body -- `"rv-7"` goes out as
    # `W/"rv-7"` -- and this API's ETag is a row-version counter that clients
    # send straight back in If-Match, where only a strong validator is accepted.
    # With gzip on, every write whose GET response happened to exceed
    # gzip_min_length came back 428 IF_MATCH_REQUIRED, so saving a quotation
    # with lines in it failed while saving an empty one worked. The API's
    # responses are paginated and small; correct concurrency is worth more than
    # the few kilobytes.
    gzip off;
    proxy_pass http://api:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
  }

  # The Cargo Loader is a self-contained application served from this origin and
  # embedded by the CRM's own Cargo Loader screen. It is the single path allowed
  # to be framed, and only by this origin; everything else keeps DENY.
  #
  location = /index.html {
    expires -1;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  location ~* \.(?:css|js|svg)$ {
    expires 1y;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;
  }
}
