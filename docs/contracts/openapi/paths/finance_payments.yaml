get:
  tags:
    - Payments
  summary: Payment facts
  operationId: get_finance_payments
  description: "Permission: payments.view. Scope: Permission + Country/account.
    Not FX-only Finance role by default."
  security:
    - WebCookie: []
    - DesktopOAuth: []
  responses:
    "200":
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/PaymentListEnvelope.yaml
    "400":
      $ref: ../components/responses/Error400.yaml
    "401":
      $ref: ../components/responses/Error401.yaml
    "403":
      $ref: ../components/responses/Error403.yaml
    "404":
      $ref: ../components/responses/Error404.yaml
    "409":
      $ref: ../components/responses/Error409.yaml
    "412":
      $ref: ../components/responses/Error412.yaml
    "422":
      $ref: ../components/responses/Error422.yaml
    "429":
      $ref: ../components/responses/Error429.yaml
    "500":
      $ref: ../components/responses/Error500.yaml
    "503":
      $ref: ../components/responses/Error503.yaml
  parameters:
    - $ref: ../components/parameters/Page.yaml
    - $ref: ../components/parameters/Offset.yaml
    - $ref: ../components/parameters/Limit.yaml
    - $ref: ../components/parameters/Sort.yaml
    - $ref: ../components/parameters/Search.yaml
    - $ref: ../components/parameters/AccountFilter.yaml
  x-abp-module: Payments
  x-abp-permission: payments.view
  x-abp-scope-rule: Permission + Country/account
  x-abp-concurrency: NONE
  x-abp-idempotency: NONE
  x-abp-request-schema: PaymentListQuery
  x-abp-success-schema: PaymentListEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
  x-abp-pagination: OFFSET
post:
  tags:
    - Payments
  summary: Create authorized MANUAL payment or source-typed finance record
  operationId: post_finance_payments
  description: "Permission: payments.create. Scope: Separate payment permission.
    sourceType/sourceKey/audit/idempotency."
  security:
    - WebCookie: []
    - DesktopOAuth: []
  responses:
    "201":
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/PaymentEnvelope.yaml
    "400":
      $ref: ../components/responses/Error400.yaml
    "401":
      $ref: ../components/responses/Error401.yaml
    "403":
      $ref: ../components/responses/Error403.yaml
    "404":
      $ref: ../components/responses/Error404.yaml
    "409":
      $ref: ../components/responses/Error409.yaml
    "412":
      $ref: ../components/responses/Error412.yaml
    "422":
      $ref: ../components/responses/Error422.yaml
    "429":
      $ref: ../components/responses/Error429.yaml
    "500":
      $ref: ../components/responses/Error500.yaml
    "503":
      $ref: ../components/responses/Error503.yaml
  parameters:
    - $ref: ../components/parameters/IdempotencyKey.yaml
    - $ref: ../components/parameters/CsrfToken.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CreatePaymentRequest.yaml
  x-abp-module: Payments
  x-abp-permission: payments.create
  x-abp-scope-rule: Separate payment permission
  x-abp-concurrency: NONE
  x-abp-idempotency: Required
  x-abp-request-schema: CreatePaymentRequest
  x-abp-success-schema: PaymentEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
