get:
  tags:
    - Platform Reference
  summary: List active canonical country references
  operationId: get_reference_countries
  description: >-
    Authenticated platform reference data for application selectors. Continent
    and marketScope are server-authoritative. This operation does not grant
    Customer visibility or widen Country Scope.
  security:
    - WebCookie: []
    - DesktopOAuth: []
  responses:
    '200':
      description: Active canonical country references in display-name order.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CountryReferenceListEnvelope.yaml
    '400':
      $ref: ../components/responses/Error400.yaml
    '401':
      $ref: ../components/responses/Error401.yaml
    '403':
      $ref: ../components/responses/Error403.yaml
    '404':
      $ref: ../components/responses/Error404.yaml
    '409':
      $ref: ../components/responses/Error409.yaml
    '412':
      $ref: ../components/responses/Error412.yaml
    '422':
      $ref: ../components/responses/Error422.yaml
    '429':
      $ref: ../components/responses/Error429.yaml
    '500':
      $ref: ../components/responses/Error500.yaml
    '503':
      $ref: ../components/responses/Error503.yaml
  x-abp-module: Platform Reference
  x-abp-permission: authenticated
  x-abp-scope-rule: Reference data only; never a visibility grant
  x-abp-concurrency: NONE
  x-abp-idempotency: NONE
  x-abp-request-schema: NONE
  x-abp-success-schema: CountryReferenceListEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
