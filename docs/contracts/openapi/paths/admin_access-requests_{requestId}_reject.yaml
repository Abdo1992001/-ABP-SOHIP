post:
  tags: [Identity]
  summary: Reject an access request
  operationId: post_admin_access-requests_by_requestId_reject
  description: 'Permission: users.manage. Scope: Admin scope.'
  security:
    - WebCookie: []
    - DesktopOAuth: []
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AccessRequestEnvelope.yaml
    '400':
      $ref: ../components/responses/Error400.yaml
    '401':
      $ref: ../components/responses/Error401.yaml
    '403':
      $ref: ../components/responses/Error403.yaml
    '404':
      $ref: ../components/responses/Error404.yaml
    '409':
      $ref: ../components/responses/Error409.yaml
    '412':
      $ref: ../components/responses/Error412.yaml
    '422':
      $ref: ../components/responses/Error422.yaml
    '429':
      $ref: ../components/responses/Error429.yaml
    '500':
      $ref: ../components/responses/Error500.yaml
    '503':
      $ref: ../components/responses/Error503.yaml
  parameters:
    - name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - $ref: ../components/parameters/IfMatch.yaml
    - $ref: ../components/parameters/CsrfToken.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/RejectAccessRequestRequest.yaml
  x-abp-module: Identity
  x-abp-permission: users.manage
  x-abp-scope-rule: Admin scope
  x-abp-concurrency: If-Match
  x-abp-idempotency: NONE
  x-abp-request-schema: RejectAccessRequestRequest
  x-abp-success-schema: AccessRequestEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
