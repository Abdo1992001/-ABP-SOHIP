get:
  tags:
    - Analytics
  summary: Imported ERP sales history
  operationId: get_reports_sales_history
  description: >-
    Permission: reports.orders. Scope: Aggregate/record scope.
    External and ACROW-group (intercompany) sales are reported separately.
  security:
    - WebCookie: []
    - DesktopOAuth: []
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/SalesHistoryEnvelope.yaml
    '400':
      $ref: ../components/responses/Error400.yaml
    '401':
      $ref: ../components/responses/Error401.yaml
    '403':
      $ref: ../components/responses/Error403.yaml
    '404':
      $ref: ../components/responses/Error404.yaml
    '409':
      $ref: ../components/responses/Error409.yaml
    '412':
      $ref: ../components/responses/Error412.yaml
    '422':
      $ref: ../components/responses/Error422.yaml
    '429':
      $ref: ../components/responses/Error429.yaml
    '500':
      $ref: ../components/responses/Error500.yaml
    '503':
      $ref: ../components/responses/Error503.yaml
  parameters:
    # Optional reporting window. The dashboard's month / quarter / year switch
    # passes it so every panel answers for the same period; omitting both keeps
    # the whole history.
    - name: from
      in: query
      required: false
      schema:
        type: string
        format: date-time
    - name: to
      in: query
      required: false
      schema:
        type: string
        format: date-time
  x-abp-module: Analytics
  x-abp-permission: reports.orders
  x-abp-scope-rule: Aggregate/record scope
  x-abp-concurrency: NONE
  x-abp-idempotency: NONE
  x-abp-request-schema: OrderReportQuery
  x-abp-success-schema: SalesHistoryEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
