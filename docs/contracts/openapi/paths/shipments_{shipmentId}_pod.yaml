post:
  tags: [Logistics]
  summary: Record the proof of delivery
  operationId: post_shipments_by_shipmentId_pod
  description: 'The signed delivery note is back: its number, an uploaded scan, or both.'
  parameters: [{ name: shipmentId, in: path, required: true, schema: { type: string, format: uuid } }, { $ref: ../components/parameters/IdempotencyKey.yaml }]
  requestBody:
    required: true
    content: { application/json: { schema: { type: object, additionalProperties: false, required: [expectedRowVersion, podReceivedAt], properties: { expectedRowVersion: { type: string, pattern: '^\d+$' }, podReceivedAt: { type: string, format: date-time }, podReference: { type: string, maxLength: 200 }, podDocumentId: { type: string, format: uuid } } } } }
  responses: { '200': { description: Recorded, content: { application/json: { schema: { $ref: ../components/schemas/ShipmentEnvelope.yaml } } } }, '400': { $ref: ../components/responses/Error400.yaml }, '404': { $ref: ../components/responses/Error404.yaml }, '412': { $ref: ../components/responses/Error412.yaml }, '422': { $ref: ../components/responses/Error422.yaml } }
  x-abp-module: Logistics
  x-abp-permission: shipments.edit
  x-abp-scope-rule: Country Scope; the shipment is delivered
  x-abp-concurrency: expectedRowVersion
  x-abp-idempotency: Required
  x-abp-execution-mode: SYNC
  x-abp-job-dto: false
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
