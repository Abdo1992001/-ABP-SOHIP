get:
  tags: [Data Quality]
  summary: List the governed global DQ queue within effective access
  operationId: get_data_quality_issues
  security: [{ WebCookie: [] }, { DesktopOAuth: [] }]
  parameters:
    - $ref: ../components/parameters/Page.yaml
    - $ref: ../components/parameters/Offset.yaml
    - $ref: ../components/parameters/Limit.yaml
    - $ref: ../components/parameters/Search.yaml
    - { name: statusCode, in: query, schema: { type: string, enum: [OPEN, RESOLVED, WAIVED] } }
    - { name: severityCode, in: query, schema: { type: string } }
    - { name: issueCode, in: query, schema: { type: string } }
    - { name: sourceEntityCode, in: query, schema: { type: string } }
    - { name: importJobId, in: query, schema: { type: string, format: uuid } }
  responses:
    '200': { description: Success, content: { application/json: { schema: { $ref: ../components/schemas/DataQualityIssueListEnvelope.yaml } } } }
    '400': { $ref: ../components/responses/Error400.yaml }
    '401': { $ref: ../components/responses/Error401.yaml }
    '403': { $ref: ../components/responses/Error403.yaml }
    '429': { $ref: ../components/responses/Error429.yaml }
    '500': { $ref: ../components/responses/Error500.yaml }
  x-abp-module: Data Quality
  x-abp-permission: data-quality.view
  x-abp-scope-rule: Permission + source ownership/safe projection + Country Scope where canonical resource exists + DENY
  x-abp-concurrency: NONE
  x-abp-idempotency: NONE
  x-abp-request-schema: DataQualityListQuery
  x-abp-success-schema: DataQualityIssueListEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
  x-abp-pagination: OFFSET
