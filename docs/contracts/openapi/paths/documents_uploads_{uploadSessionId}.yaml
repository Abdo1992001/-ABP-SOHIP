get:
  tags:
    - Documents
  summary: Poll upload session / malware scan status
  operationId: get_documents_uploads_by_uploadSessionId
  description: >-
    Returns the current state of an upload session, including malware scan
    status and the resulting document once available. Permission:
    documents.create. Scope: Upload owner.
  security:
    - WebCookie: []
    - DesktopOAuth: []
  parameters:
    - name: uploadSessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/UploadSessionEnvelope.yaml
    '400':
      $ref: ../components/responses/Error400.yaml
    '401':
      $ref: ../components/responses/Error401.yaml
    '403':
      $ref: ../components/responses/Error403.yaml
    '404':
      $ref: ../components/responses/Error404.yaml
    '429':
      $ref: ../components/responses/Error429.yaml
    '500':
      $ref: ../components/responses/Error500.yaml
    '503':
      $ref: ../components/responses/Error503.yaml
  x-abp-module: Documents
  x-abp-permission: documents.create
  x-abp-scope-rule: Upload owner
  x-abp-concurrency: NONE
  x-abp-idempotency: NONE
  x-abp-request-schema: NONE
  x-abp-success-schema: UploadSessionEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
