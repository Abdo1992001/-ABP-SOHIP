get:
  tags:
    - Logistics
  summary: 2D/3D placement data
  operationId: get_logistics_plan_versions_by_versionId_visualization
  description: >-
    Permission: logistics.view. Scope: Plan scope. Placement groups, not
    board-by-board.
  security:
    - WebCookie: []
    - DesktopOAuth: []
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/LogisticsVisualizationEnvelope.yaml
    '400':
      $ref: ../components/responses/Error400.yaml
    '401':
      $ref: ../components/responses/Error401.yaml
    '403':
      $ref: ../components/responses/Error403.yaml
    '404':
      $ref: ../components/responses/Error404.yaml
    '409':
      $ref: ../components/responses/Error409.yaml
    '412':
      $ref: ../components/responses/Error412.yaml
    '422':
      $ref: ../components/responses/Error422.yaml
    '429':
      $ref: ../components/responses/Error429.yaml
    '500':
      $ref: ../components/responses/Error500.yaml
    '503':
      $ref: ../components/responses/Error503.yaml
  parameters:
    - name: versionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  x-abp-module: Logistics
  x-abp-permission: logistics.view
  x-abp-scope-rule: Plan scope
  x-abp-concurrency: NONE
  x-abp-idempotency: NONE
  x-abp-request-schema: VisualizationQuery
  x-abp-success-schema: LogisticsVisualizationEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
