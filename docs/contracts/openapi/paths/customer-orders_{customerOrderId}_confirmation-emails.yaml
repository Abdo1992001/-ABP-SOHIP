post:
  tags:
    - Customer Orders
  summary: Email the order confirmation
  operationId: post_customer_orders_by_customerOrderId_confirmation_emails
  description: 'Permission: sales-orders.view. Renders the order confirmation PDF and emails it to the customer from the company mailbox; replies reach the salesperson. Only for a confirmed order, and only when email is set up.'
  security:
    - WebCookie: []
    - DesktopOAuth: []
  responses:
    '202':
      description: Queued
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CustomerOrderEnvelope.yaml
    '400':
      $ref: ../components/responses/Error400.yaml
    '401':
      $ref: ../components/responses/Error401.yaml
    '403':
      $ref: ../components/responses/Error403.yaml
    '404':
      $ref: ../components/responses/Error404.yaml
    '409':
      $ref: ../components/responses/Error409.yaml
    '412':
      $ref: ../components/responses/Error412.yaml
    '422':
      $ref: ../components/responses/Error422.yaml
    '429':
      $ref: ../components/responses/Error429.yaml
    '500':
      $ref: ../components/responses/Error500.yaml
    '503':
      $ref: ../components/responses/Error503.yaml
  parameters:
    - name: customerOrderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - $ref: ../components/parameters/IdempotencyKey.yaml
    - $ref: ../components/parameters/CsrfToken.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/SendOrderConfirmationRequest.yaml
  x-abp-module: Customer Orders
  x-abp-permission: sales-orders.view
  x-abp-scope-rule: Account access within country scope
  x-abp-concurrency: NONE
  x-abp-idempotency: Required
  x-abp-request-schema: SendOrderConfirmationRequest
  x-abp-success-schema: CustomerOrderEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: ASYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
