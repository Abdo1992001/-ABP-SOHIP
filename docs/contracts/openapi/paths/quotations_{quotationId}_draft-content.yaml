put:
  tags:
    - Quotation
  summary: Autosave full draft content
  operationId: put_quotations_by_quotationId_draft_content
  description: >-
    Permission: quotations.edit. Scope: Quote/customer scope. Only DRAFT
    mutable; server recalculates.
  security:
    - WebCookie: []
    - DesktopOAuth: []
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/QuotationEnvelope.yaml
      headers:
        ETag:
          $ref: ../components/headers/ETag.yaml
    '400':
      $ref: ../components/responses/Error400.yaml
    '401':
      $ref: ../components/responses/Error401.yaml
    '403':
      $ref: ../components/responses/Error403.yaml
    '404':
      $ref: ../components/responses/Error404.yaml
    '409':
      $ref: ../components/responses/Error409.yaml
    '412':
      $ref: ../components/responses/Error412.yaml
    '422':
      $ref: ../components/responses/Error422.yaml
    '429':
      $ref: ../components/responses/Error429.yaml
    '500':
      $ref: ../components/responses/Error500.yaml
    '503':
      $ref: ../components/responses/Error503.yaml
  parameters:
    - name: quotationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - $ref: ../components/parameters/IfMatch.yaml
    - $ref: ../components/parameters/CsrfToken.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/SaveQuotationDraftRequest.yaml
  x-abp-module: Quotation
  x-abp-permission: quotations.edit
  x-abp-scope-rule: Quote/customer scope
  x-abp-concurrency: If-Match
  x-abp-idempotency: Recommended
  x-abp-request-schema: SaveQuotationDraftRequest
  x-abp-success-schema: QuotationEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
