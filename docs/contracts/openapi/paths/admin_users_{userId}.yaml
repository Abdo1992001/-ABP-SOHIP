get:
  tags:
    - Identity
  summary: Read one user's effective access
  operationId: get_admin_users_by_userId
  description: >-
    Permission: users.view. Scope: Admin scope. Returns the user with their
    roles, country access, effective permissions and explicit denies. Without
    this, the two access PUTs were the only way to see a user's roles or
    countries — and they only report them after replacing them, so an
    administrator was overwriting a list they had no way to read first.
  security:
    - WebCookie: []
    - DesktopOAuth: []
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/UserAccessEnvelope.yaml
    '400':
      $ref: ../components/responses/Error400.yaml
    '401':
      $ref: ../components/responses/Error401.yaml
    '403':
      $ref: ../components/responses/Error403.yaml
    '404':
      $ref: ../components/responses/Error404.yaml
    '429':
      $ref: ../components/responses/Error429.yaml
    '500':
      $ref: ../components/responses/Error500.yaml
    '503':
      $ref: ../components/responses/Error503.yaml
  parameters:
    - name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  x-abp-module: Identity
  x-abp-permission: users.view
  x-abp-scope-rule: Admin scope
  x-abp-concurrency: NONE
  x-abp-idempotency: NONE
  x-abp-request-schema: NONE
  x-abp-success-schema: UserAccessEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
patch:
  tags:
    - Identity
  summary: Update profile/lifecycle-safe fields
  operationId: patch_admin_users_by_userId
  description: 'Permission: users.manage. Scope: Admin scope. camelCase contract.'
  security:
    - WebCookie: []
    - DesktopOAuth: []
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/UserEnvelope.yaml
      headers:
        ETag:
          $ref: ../components/headers/ETag.yaml
    '400':
      $ref: ../components/responses/Error400.yaml
    '401':
      $ref: ../components/responses/Error401.yaml
    '403':
      $ref: ../components/responses/Error403.yaml
    '404':
      $ref: ../components/responses/Error404.yaml
    '409':
      $ref: ../components/responses/Error409.yaml
    '412':
      $ref: ../components/responses/Error412.yaml
    '422':
      $ref: ../components/responses/Error422.yaml
    '429':
      $ref: ../components/responses/Error429.yaml
    '500':
      $ref: ../components/responses/Error500.yaml
    '503':
      $ref: ../components/responses/Error503.yaml
  parameters:
    - name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - $ref: ../components/parameters/IfMatch.yaml
    - $ref: ../components/parameters/CsrfToken.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/UpdateUserRequest.yaml
  x-abp-module: Identity
  x-abp-permission: users.manage
  x-abp-scope-rule: Admin scope
  x-abp-concurrency: If-Match
  x-abp-idempotency: NONE
  x-abp-request-schema: UpdateUserRequest
  x-abp-success-schema: UserEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
