get:
  tags: [Reconciliation]
  summary: List authorized reconciliation run history
  operationId: get_reconciliation_runs
  security: [{ WebCookie: [] }, { DesktopOAuth: [] }]
  parameters:
    - $ref: ../components/parameters/Page.yaml
    - $ref: ../components/parameters/Offset.yaml
    - $ref: ../components/parameters/Limit.yaml
    - $ref: ../components/parameters/Search.yaml
    - { name: statusCode, in: query, schema: { type: string } }
    - { name: reconciliationTypeCode, in: query, schema: { type: string } }
    - { name: importJobId, in: query, schema: { type: string, format: uuid } }
  responses:
    '200': { description: Success, content: { application/json: { schema: { $ref: ../components/schemas/ReconciliationRunListEnvelope.yaml } } } }
    '400': { $ref: ../components/responses/Error400.yaml }
    '401': { $ref: ../components/responses/Error401.yaml }
    '403': { $ref: ../components/responses/Error403.yaml }
    '429': { $ref: ../components/responses/Error429.yaml }
    '500': { $ref: ../components/responses/Error500.yaml }
  x-abp-module: Reconciliation
  x-abp-permission: reconciliation.view
  x-abp-scope-rule: Authorized actor history + DENY
  x-abp-concurrency: NONE
  x-abp-idempotency: NONE
  x-abp-request-schema: ReconciliationListQuery
  x-abp-success-schema: ReconciliationRunListEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
  x-abp-pagination: OFFSET
post:
  tags:
    - Reconciliation
  summary: Start reconciliation job
  operationId: post_reconciliation_runs
  description: 'Permission: reconciliation.run. Scope: Authorized data steward. '
  security:
    - WebCookie: []
    - DesktopOAuth: []
  responses:
    '202':
      description: Accepted
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ReconciliationRunEnvelope.yaml
    '400':
      $ref: ../components/responses/Error400.yaml
    '401':
      $ref: ../components/responses/Error401.yaml
    '403':
      $ref: ../components/responses/Error403.yaml
    '404':
      $ref: ../components/responses/Error404.yaml
    '409':
      $ref: ../components/responses/Error409.yaml
    '412':
      $ref: ../components/responses/Error412.yaml
    '422':
      $ref: ../components/responses/Error422.yaml
    '429':
      $ref: ../components/responses/Error429.yaml
    '500':
      $ref: ../components/responses/Error500.yaml
    '503':
      $ref: ../components/responses/Error503.yaml
  parameters:
    - $ref: ../components/parameters/IdempotencyKey.yaml
    - $ref: ../components/parameters/CsrfToken.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CreateReconciliationRunRequest.yaml
  x-abp-module: Reconciliation
  x-abp-permission: reconciliation.run
  x-abp-scope-rule: Authorized data steward
  x-abp-concurrency: NONE
  x-abp-idempotency: Required
  x-abp-request-schema: CreateReconciliationRunRequest
  x-abp-success-schema: ReconciliationRunEnvelope
  x-abp-job-dto: true
  x-abp-execution-mode: ASYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
