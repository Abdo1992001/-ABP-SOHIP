get:
  tags:
    - Finance FX
  summary: List FX rates
  operationId: get_finance_fx_rates
  description: >-
    Permission: finance.fx.view. Scope: FX permission only. Finance role default
    allowed only here.
  security:
    - WebCookie: []
    - DesktopOAuth: []
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/FxRateListEnvelope.yaml
    '400':
      $ref: ../components/responses/Error400.yaml
    '401':
      $ref: ../components/responses/Error401.yaml
    '403':
      $ref: ../components/responses/Error403.yaml
    '404':
      $ref: ../components/responses/Error404.yaml
    '409':
      $ref: ../components/responses/Error409.yaml
    '412':
      $ref: ../components/responses/Error412.yaml
    '422':
      $ref: ../components/responses/Error422.yaml
    '429':
      $ref: ../components/responses/Error429.yaml
    '500':
      $ref: ../components/responses/Error500.yaml
    '503':
      $ref: ../components/responses/Error503.yaml
  parameters:
    - $ref: ../components/parameters/Page.yaml
    - $ref: ../components/parameters/Offset.yaml
    - $ref: ../components/parameters/Limit.yaml
    - $ref: ../components/parameters/Sort.yaml
    - $ref: ../components/parameters/Search.yaml
  x-abp-module: Finance FX
  x-abp-permission: finance.fx.view
  x-abp-scope-rule: FX permission only
  x-abp-concurrency: NONE
  x-abp-idempotency: NONE
  x-abp-request-schema: FxRateListQuery
  x-abp-success-schema: FxRateListEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
  x-abp-pagination: OFFSET
post:
  tags:
    - Finance FX
  summary: Create or correct an effective USD/EGP FX version
  operationId: post_finance_fx_rates
  description: >-
    Permission: finance.fx.edit. Scope: FX-only Finance role. No retroactive
    edit.
  security:
    - WebCookie: []
    - DesktopOAuth: []
  responses:
    '201':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/FxRateEnvelope.yaml
    '400':
      $ref: ../components/responses/Error400.yaml
    '401':
      $ref: ../components/responses/Error401.yaml
    '403':
      $ref: ../components/responses/Error403.yaml
    '404':
      $ref: ../components/responses/Error404.yaml
    '409':
      $ref: ../components/responses/Error409.yaml
    '412':
      $ref: ../components/responses/Error412.yaml
    '422':
      $ref: ../components/responses/Error422.yaml
    '429':
      $ref: ../components/responses/Error429.yaml
    '500':
      $ref: ../components/responses/Error500.yaml
    '503':
      $ref: ../components/responses/Error503.yaml
  parameters:
    - $ref: ../components/parameters/IdempotencyKey.yaml
    - $ref: ../components/parameters/CsrfToken.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CreateFxRateRequest.yaml
  x-abp-module: Finance FX
  x-abp-permission: finance.fx.edit
  x-abp-scope-rule: FX-only Finance role
  x-abp-concurrency: NONE
  x-abp-idempotency: Required
  x-abp-request-schema: CreateFxRateRequest
  x-abp-success-schema: FxRateEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
