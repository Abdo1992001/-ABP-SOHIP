post:
  tags:
    - Logistics
  summary: Create new scenario version
  operationId: post_logistics_plans_by_planId_versions
  description: 'Permission: logistics.edit. Scope: Plan scope. '
  security:
    - WebCookie: []
    - DesktopOAuth: []
  responses:
    '201':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/LogisticsPlanVersionEnvelope.yaml
    '400':
      $ref: ../components/responses/Error400.yaml
    '401':
      $ref: ../components/responses/Error401.yaml
    '403':
      $ref: ../components/responses/Error403.yaml
    '404':
      $ref: ../components/responses/Error404.yaml
    '409':
      $ref: ../components/responses/Error409.yaml
    '412':
      $ref: ../components/responses/Error412.yaml
    '422':
      $ref: ../components/responses/Error422.yaml
    '429':
      $ref: ../components/responses/Error429.yaml
    '500':
      $ref: ../components/responses/Error500.yaml
    '503':
      $ref: ../components/responses/Error503.yaml
  parameters:
    - name: planId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - $ref: ../components/parameters/IdempotencyKey.yaml
    - $ref: ../components/parameters/CsrfToken.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CreateLogisticsVersionRequest.yaml
  x-abp-module: Logistics
  x-abp-permission: logistics.edit
  x-abp-scope-rule: Plan scope
  x-abp-concurrency: NONE
  x-abp-idempotency: Required
  x-abp-request-schema: CreateLogisticsVersionRequest
  x-abp-success-schema: LogisticsPlanVersionEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
