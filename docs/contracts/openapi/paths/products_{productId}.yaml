get:
  tags:
    - Catalog
  summary: Canonical product detail
  operationId: get_products_by_productId
  description: 'Permission: catalog.view. Scope: Authorized. '
  security:
    - WebCookie: []
    - DesktopOAuth: []
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ProductEnvelope.yaml
    '400':
      $ref: ../components/responses/Error400.yaml
    '401':
      $ref: ../components/responses/Error401.yaml
    '403':
      $ref: ../components/responses/Error403.yaml
    '404':
      $ref: ../components/responses/Error404.yaml
    '409':
      $ref: ../components/responses/Error409.yaml
    '412':
      $ref: ../components/responses/Error412.yaml
    '422':
      $ref: ../components/responses/Error422.yaml
    '429':
      $ref: ../components/responses/Error429.yaml
    '500':
      $ref: ../components/responses/Error500.yaml
    '503':
      $ref: ../components/responses/Error503.yaml
  parameters:
    - name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  x-abp-module: Catalog
  x-abp-permission: catalog.view
  x-abp-scope-rule: Authorized
  x-abp-concurrency: NONE
  x-abp-idempotency: NONE
  x-abp-request-schema: NONE
  x-abp-success-schema: ProductEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
patch:
  tags:
    - Catalog
  summary: Update canonical product
  operationId: patch_products_by_productId
  description: 'Permission: catalog.manage. Scope: Catalog admin. '
  security:
    - WebCookie: []
    - DesktopOAuth: []
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ProductEnvelope.yaml
      headers:
        ETag:
          $ref: ../components/headers/ETag.yaml
    '400':
      $ref: ../components/responses/Error400.yaml
    '401':
      $ref: ../components/responses/Error401.yaml
    '403':
      $ref: ../components/responses/Error403.yaml
    '404':
      $ref: ../components/responses/Error404.yaml
    '409':
      $ref: ../components/responses/Error409.yaml
    '412':
      $ref: ../components/responses/Error412.yaml
    '422':
      $ref: ../components/responses/Error422.yaml
    '429':
      $ref: ../components/responses/Error429.yaml
    '500':
      $ref: ../components/responses/Error500.yaml
    '503':
      $ref: ../components/responses/Error503.yaml
  parameters:
    - name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - $ref: ../components/parameters/IfMatch.yaml
    - $ref: ../components/parameters/CsrfToken.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/UpdateProductRequest.yaml
  x-abp-module: Catalog
  x-abp-permission: catalog.manage
  x-abp-scope-rule: Catalog admin
  x-abp-concurrency: If-Match
  x-abp-idempotency: NONE
  x-abp-request-schema: UpdateProductRequest
  x-abp-success-schema: ProductEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
