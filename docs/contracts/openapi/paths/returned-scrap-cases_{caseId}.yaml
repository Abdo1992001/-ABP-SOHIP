    - Returns
  summary: Edit DRAFT Returned Scrap assessment only
  operationId: patch_returned_scrap_cases_by_caseId
  description: 'Permission: returns.edit. Scope: Case scope. '
  security:
    - WebCookie: []
    - DesktopOAuth: []
