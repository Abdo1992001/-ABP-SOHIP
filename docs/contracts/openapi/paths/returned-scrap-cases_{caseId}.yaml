get:
  tags:
    - Returns
  summary: Case detail
  operationId: get_returned_scrap_cases_by_caseId
  description: 'Permission: returns.view. Scope: Case/customer scope. '
  security:
    - WebCookie: []
    - DesktopOAuth: []
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ReturnedScrapCaseEnvelope.yaml
    '400':
      $ref: ../components/responses/Error400.yaml
