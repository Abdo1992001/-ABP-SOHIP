get:
  tags:
    - Analytics
  summary: Booked/Shipped/Invoiced/Collected metrics separate from target
  operationId: get_metrics_commercial
  description: >-
    Permission: reports.commercial. Scope: Aggregate scope. Never substitutes
    target achieved.
  security:
    - WebCookie: []
    - DesktopOAuth: []
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CommercialMetricsEnvelope.yaml
    '400':
      $ref: ../components/responses/Error400.yaml
    '401':
      $ref: ../components/responses/Error401.yaml
    '403':
      $ref: ../components/responses/Error403.yaml
    '404':
      $ref: ../components/responses/Error404.yaml
    '409':
      $ref: ../components/responses/Error409.yaml
    '412':
      $ref: ../components/responses/Error412.yaml
    '422':
      $ref: ../components/responses/Error422.yaml
    '429':
      $ref: ../components/responses/Error429.yaml
    '500':
      $ref: ../components/responses/Error500.yaml
    '503':
      $ref: ../components/responses/Error503.yaml
  x-abp-module: Analytics
  x-abp-permission: reports.commercial
  x-abp-scope-rule: Aggregate scope
  x-abp-concurrency: NONE
  x-abp-idempotency: NONE
  x-abp-request-schema: CommercialMetricsQuery
  x-abp-success-schema: CommercialMetricsEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
