post:
  tags:
    - Logistics
  summary: Compare selected versions
  operationId: post_logistics_compare
  description: >-
    Permission: logistics.view. Scope: All plan versions accessible. Manual
    lines separated from official board metrics.
  security:
    - WebCookie: []
    - DesktopOAuth: []
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/LogisticsComparisonEnvelope.yaml
    '400':
      $ref: ../components/responses/Error400.yaml
    '401':
      $ref: ../components/responses/Error401.yaml
    '403':
      $ref: ../components/responses/Error403.yaml
    '404':
      $ref: ../components/responses/Error404.yaml
    '409':
      $ref: ../components/responses/Error409.yaml
    '412':
      $ref: ../components/responses/Error412.yaml
    '422':
      $ref: ../components/responses/Error422.yaml
    '429':
      $ref: ../components/responses/Error429.yaml
    '500':
      $ref: ../components/responses/Error500.yaml
    '503':
      $ref: ../components/responses/Error503.yaml
  parameters:
    - $ref: ../components/parameters/CsrfToken.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CompareLogisticsRequest.yaml
  x-abp-module: Logistics
  x-abp-permission: logistics.view
  x-abp-scope-rule: All plan versions accessible
  x-abp-concurrency: NONE
  x-abp-idempotency: NONE
  x-abp-request-schema: CompareLogisticsRequest
  x-abp-success-schema: LogisticsComparisonEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
