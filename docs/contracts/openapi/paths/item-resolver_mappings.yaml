post:
  tags:
    - Catalog
  summary: Approve/create mapping
  operationId: post_item_resolver_mappings
  description: >-
    Permission: item-resolver.manage. Scope: Data/catalog steward. Lineage
    mandatory.
  security:
    - WebCookie: []
    - DesktopOAuth: []
  responses:
    '201':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ItemMappingEnvelope.yaml
    '400':
      $ref: ../components/responses/Error400.yaml
    '401':
      $ref: ../components/responses/Error401.yaml
    '403':
      $ref: ../components/responses/Error403.yaml
    '404':
      $ref: ../components/responses/Error404.yaml
    '409':
      $ref: ../components/responses/Error409.yaml
    '412':
      $ref: ../components/responses/Error412.yaml
    '422':
      $ref: ../components/responses/Error422.yaml
    '429':
      $ref: ../components/responses/Error429.yaml
    '500':
      $ref: ../components/responses/Error500.yaml
    '503':
      $ref: ../components/responses/Error503.yaml
  parameters:
    - $ref: ../components/parameters/IdempotencyKey.yaml
    - $ref: ../components/parameters/CsrfToken.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CreateItemMappingRequest.yaml
  x-abp-module: Catalog
  x-abp-permission: item-resolver.manage
  x-abp-scope-rule: Data/catalog steward
  x-abp-concurrency: NONE
  x-abp-idempotency: Required
  x-abp-request-schema: CreateItemMappingRequest
  x-abp-success-schema: ItemMappingEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
