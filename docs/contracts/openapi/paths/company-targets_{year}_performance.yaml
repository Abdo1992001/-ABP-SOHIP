get:
  tags:
    - Targets
  summary: Target vs WON performance
  operationId: get_company_targets_by_year_performance
  description: 'Permission: targets.view. Scope: Authorized aggregate. Achieved = WON only.'
  security:
    - WebCookie: []
    - DesktopOAuth: []
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/TargetPerformanceEnvelope.yaml
    '400':
      $ref: ../components/responses/Error400.yaml
    '401':
      $ref: ../components/responses/Error401.yaml
    '403':
      $ref: ../components/responses/Error403.yaml
    '404':
      $ref: ../components/responses/Error404.yaml
    '409':
      $ref: ../components/responses/Error409.yaml
    '412':
      $ref: ../components/responses/Error412.yaml
    '422':
      $ref: ../components/responses/Error422.yaml
    '429':
      $ref: ../components/responses/Error429.yaml
    '500':
      $ref: ../components/responses/Error500.yaml
    '503':
      $ref: ../components/responses/Error503.yaml
  parameters:
    - name: year
      in: path
      required: true
      schema:
        type: string
        format: string
  x-abp-module: Targets
  x-abp-permission: targets.view
  x-abp-scope-rule: Authorized aggregate
  x-abp-concurrency: NONE
  x-abp-idempotency: NONE
  x-abp-request-schema: TargetPerformanceQuery
  x-abp-success-schema: TargetPerformanceEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
