post:
  tags: [Identity]
  summary: Reset a local user's password and revoke sessions
  operationId: post_admin_users_by_userId_reset_password
  parameters:
    - name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    - $ref: ../components/parameters/CsrfToken.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema: { $ref: ../components/schemas/ResetPasswordRequest.yaml }
  responses:
    '201':
      description: Password reset
      content:
        application/json:
          schema: { $ref: ../components/schemas/LocalResetEnvelope.yaml }
    '400': { $ref: ../components/responses/Error400.yaml }
    '401': { $ref: ../components/responses/Error401.yaml }
    '403': { $ref: ../components/responses/Error403.yaml }
    '404': { $ref: ../components/responses/Error404.yaml }
    '500': { $ref: ../components/responses/Error500.yaml }
  x-abp-module: Identity
  x-abp-permission: users.manage
  x-abp-scope-rule: ADMIN workspace and explicit permission
  x-abp-concurrency: NONE
  x-abp-idempotency: NONE
  x-abp-request-schema: ResetPasswordRequest
  x-abp-success-schema: LocalResetEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
