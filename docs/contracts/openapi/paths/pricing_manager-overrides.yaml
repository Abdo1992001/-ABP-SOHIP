post:
  tags:
    - Pricing
  summary: Apply authorized direct below-Min manager override
  operationId: post_pricing_manager_overrides
  description: >-
    Permission: pricing.override_min. Scope: Context access. Reason/audit
    mandatory.
  security:
    - WebCookie: []
    - DesktopOAuth: []
  responses:
    '201':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/PriceOverrideEnvelope.yaml
    '400':
      $ref: ../components/responses/Error400.yaml
    '401':
      $ref: ../components/responses/Error401.yaml
    '403':
      $ref: ../components/responses/Error403.yaml
    '404':
      $ref: ../components/responses/Error404.yaml
    '409':
      $ref: ../components/responses/Error409.yaml
    '412':
      $ref: ../components/responses/Error412.yaml
    '422':
      $ref: ../components/responses/Error422.yaml
    '429':
      $ref: ../components/responses/Error429.yaml
    '500':
      $ref: ../components/responses/Error500.yaml
    '503':
      $ref: ../components/responses/Error503.yaml
  parameters:
    - $ref: ../components/parameters/IdempotencyKey.yaml
    - $ref: ../components/parameters/CsrfToken.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/PriceOverrideRequest.yaml
  x-abp-module: Pricing
  x-abp-permission: pricing.override_min
  x-abp-scope-rule: Context access
  x-abp-concurrency: NONE
  x-abp-idempotency: Required
  x-abp-request-schema: PriceOverrideRequest
  x-abp-success-schema: PriceOverrideEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
