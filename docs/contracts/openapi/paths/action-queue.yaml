get:
  tags:
    - Dashboard
  summary: Derived action queue
  operationId: get_action_queue
  description: >-
    Permission: authenticated. Scope: Self effective scope. Derived from source
    entities.
  security:
    - WebCookie: []
    - DesktopOAuth: []
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ActionQueueEnvelope.yaml
    '400':
      $ref: ../components/responses/Error400.yaml
    '401':
      $ref: ../components/responses/Error401.yaml
    '403':
      $ref: ../components/responses/Error403.yaml
    '404':
      $ref: ../components/responses/Error404.yaml
    '409':
      $ref: ../components/responses/Error409.yaml
    '412':
      $ref: ../components/responses/Error412.yaml
    '422':
      $ref: ../components/responses/Error422.yaml
    '429':
      $ref: ../components/responses/Error429.yaml
    '500':
      $ref: ../components/responses/Error500.yaml
    '503':
      $ref: ../components/responses/Error503.yaml
  x-abp-module: Dashboard
  x-abp-permission: authenticated
  x-abp-scope-rule: Self effective scope
  x-abp-concurrency: NONE
  x-abp-idempotency: NONE
  x-abp-request-schema: ActionQueueQuery
  x-abp-success-schema: ActionQueueEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
