get:
  tags: [Logistics]
  summary: Shipment tracking detail and immutable history
  operationId: get_shipments_by_shipmentId
  parameters: [{ name: shipmentId, in: path, required: true, schema: { type: string, format: uuid } }]
  responses: { '200': { description: Success, content: { application/json: { schema: { $ref: ../components/schemas/ShipmentEnvelope.yaml } } } }, '400': { $ref: ../components/responses/Error400.yaml } }
  x-abp-module: Logistics
  x-abp-permission: shipments.view
  x-abp-scope-rule: Country Scope; portal uses a separate customer-bound projection
  x-abp-concurrency: NONE
  x-abp-execution-mode: SYNC
  x-abp-job-dto: false
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
