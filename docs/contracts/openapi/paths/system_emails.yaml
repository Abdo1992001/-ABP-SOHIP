get:
  tags: [System]
  summary: Recent emails
  operationId: get_system_emails
  description: 'The latest emails the system queued or sent, what became of each, and counts for the last seven days.'
  parameters:
    - name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100 }
  security:
    - WebCookie: []
    - DesktopOAuth: []
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema: { $ref: ../components/schemas/SystemEmailsEnvelope.yaml }
    '401': { $ref: ../components/responses/Error401.yaml }
    '403': { $ref: ../components/responses/Error403.yaml }
    '422': { $ref: ../components/responses/Error422.yaml }
    '429': { $ref: ../components/responses/Error429.yaml }
    '500': { $ref: ../components/responses/Error500.yaml }
  x-abp-module: System
  x-abp-permission: users.manage
  x-abp-scope-rule: System-wide
  x-abp-concurrency: NONE
  x-abp-idempotency: NONE
  x-abp-request-schema: NONE
  x-abp-success-schema: SystemEmailsEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
