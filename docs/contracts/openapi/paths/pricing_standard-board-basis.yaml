get:
  tags:
    - Pricing
  summary: Get effective Standard Board price/weight/derived kg rate
  operationId: get_pricing_standard_board_basis
  description: 'Permission: pricing.view. Scope: Authorized. kg rate derived.'
  security:
    - WebCookie: []
    - DesktopOAuth: []
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/PricingBasisEnvelope.yaml
    '400':
      $ref: ../components/responses/Error400.yaml
    '401':
      $ref: ../components/responses/Error401.yaml
    '403':
      $ref: ../components/responses/Error403.yaml
    '404':
      $ref: ../components/responses/Error404.yaml
    '409':
      $ref: ../components/responses/Error409.yaml
    '412':
      $ref: ../components/responses/Error412.yaml
    '422':
      $ref: ../components/responses/Error422.yaml
    '429':
      $ref: ../components/responses/Error429.yaml
    '500':
      $ref: ../components/responses/Error500.yaml
    '503':
      $ref: ../components/responses/Error503.yaml
  x-abp-module: Pricing
  x-abp-permission: pricing.view
  x-abp-scope-rule: Authorized
  x-abp-concurrency: NONE
  x-abp-idempotency: NONE
  x-abp-request-schema: PricingBasisQuery
  x-abp-success-schema: PricingBasisEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
post:
  tags:
    - Pricing
  summary: Update company pricing settings (STANDARD/CURVED/CIRCULAR rates, density, board reference, default discount)
  operationId: post_pricing_standard_board_basis
  description: 'Permission: pricing.policy.manage. Scope: Policy admin. Creates a new effective-dated PricingBaseConfig row; the previous one is closed, so already-issued quotations keep their saved priceSnapshot rates.'
  security:
    - WebCookie: []
    - DesktopOAuth: []
  responses:
    '201':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/PricingBasisEnvelope.yaml
    '400':
      $ref: ../components/responses/Error400.yaml
    '401':
      $ref: ../components/responses/Error401.yaml
    '403':
      $ref: ../components/responses/Error403.yaml
    '404':
      $ref: ../components/responses/Error404.yaml
    '409':
      $ref: ../components/responses/Error409.yaml
    '412':
      $ref: ../components/responses/Error412.yaml
    '422':
      $ref: ../components/responses/Error422.yaml
    '429':
      $ref: ../components/responses/Error429.yaml
    '500':
      $ref: ../components/responses/Error500.yaml
    '503':
      $ref: ../components/responses/Error503.yaml
  parameters:
    - $ref: ../components/parameters/IdempotencyKey.yaml
    - $ref: ../components/parameters/CsrfToken.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/UpdateCompanyPricingSettingsRequest.yaml
  x-abp-module: Pricing
  x-abp-permission: pricing.policy.manage
  x-abp-scope-rule: Policy admin
  x-abp-concurrency: NONE
  x-abp-idempotency: Required
  x-abp-request-schema: UpdateCompanyPricingSettingsRequest
  x-abp-success-schema: PricingBasisEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
