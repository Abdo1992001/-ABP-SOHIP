post:
  tags:
    - Pricing
  summary: Create effective min/reference/max rule
  operationId: post_pricing_guardrails
  description: >-
    Permission: pricing.manage. Scope: Authorized pricing admin. No retroactive
    mutation.
  security:
    - WebCookie: []
    - DesktopOAuth: []
  responses:
    '201':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/GuardrailEnvelope.yaml
    '400':
      $ref: ../components/responses/Error400.yaml
    '401':
      $ref: ../components/responses/Error401.yaml
    '403':
      $ref: ../components/responses/Error403.yaml
    '404':
      $ref: ../components/responses/Error404.yaml
    '409':
      $ref: ../components/responses/Error409.yaml
    '412':
      $ref: ../components/responses/Error412.yaml
    '422':
      $ref: ../components/responses/Error422.yaml
    '429':
      $ref: ../components/responses/Error429.yaml
    '500':
      $ref: ../components/responses/Error500.yaml
    '503':
      $ref: ../components/responses/Error503.yaml
  parameters:
    - $ref: ../components/parameters/IdempotencyKey.yaml
    - $ref: ../components/parameters/CsrfToken.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CreateGuardrailRequest.yaml
  x-abp-module: Pricing
  x-abp-permission: pricing.manage
  x-abp-scope-rule: Authorized pricing admin
  x-abp-concurrency: NONE
  x-abp-idempotency: Required
  x-abp-request-schema: CreateGuardrailRequest
  x-abp-success-schema: GuardrailEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
