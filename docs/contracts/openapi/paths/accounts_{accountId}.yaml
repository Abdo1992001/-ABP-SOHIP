get:
  tags:
    - CRM
  summary: Customer detail
  operationId: get_accounts_by_accountId
  description: >-
    Permission: accounts.view. Scope: Country then permission, explicit DENY,
    configured owner/manager/share/context, and field projection. The ETag and
    AccountDetail.rowVersion values are identical strong "rv-N" tokens.
  security:
    - WebCookie: []
    - DesktopOAuth: []
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AccountDetailEnvelope.yaml
      headers:
        ETag:
          $ref: ../components/headers/ETag.yaml
    '400':
      $ref: ../components/responses/Error400.yaml
    '401':
      $ref: ../components/responses/Error401.yaml
    '403':
      $ref: ../components/responses/Error403.yaml
    '404':
      $ref: ../components/responses/Error404.yaml
    '409':
      $ref: ../components/responses/Error409.yaml
    '412':
      $ref: ../components/responses/Error412.yaml
    '422':
      $ref: ../components/responses/Error422.yaml
    '429':
      $ref: ../components/responses/Error429.yaml
    '500':
      $ref: ../components/responses/Error500.yaml
    '503':
      $ref: ../components/responses/Error503.yaml
  parameters:
    - name: accountId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  x-abp-module: CRM
  x-abp-permission: accounts.view
  x-abp-scope-rule: Record policy
  x-abp-concurrency: NONE
  x-abp-idempotency: NONE
  x-abp-request-schema: NONE
  x-abp-success-schema: AccountDetailEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
patch:
  tags:
    - CRM
  summary: Update ordinary account fields
  operationId: patch_accounts_by_accountId
  description: >-
    Permission: accounts.edit. Scope: Record policy. Ownership/status critical
    actions separate.
  security:
    - WebCookie: []
    - DesktopOAuth: []
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AccountDetailEnvelope.yaml
      headers:
        ETag:
          $ref: ../components/headers/ETag.yaml
    '400':
      $ref: ../components/responses/Error400.yaml
    '401':
      $ref: ../components/responses/Error401.yaml
    '403':
      $ref: ../components/responses/Error403.yaml
    '404':
      $ref: ../components/responses/Error404.yaml
    '409':
      $ref: ../components/responses/Error409.yaml
    '412':
      $ref: ../components/responses/Error412.yaml
    '422':
      $ref: ../components/responses/Error422.yaml
    '429':
      $ref: ../components/responses/Error429.yaml
    '500':
      $ref: ../components/responses/Error500.yaml
    '503':
      $ref: ../components/responses/Error503.yaml
  parameters:
    - name: accountId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - $ref: ../components/parameters/IfMatch.yaml
    - $ref: ../components/parameters/CsrfToken.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/UpdateAccountRequest.yaml
  x-abp-module: CRM
  x-abp-permission: accounts.edit
  x-abp-scope-rule: Record policy
  x-abp-concurrency: If-Match
  x-abp-idempotency: NONE
  x-abp-request-schema: UpdateAccountRequest
  x-abp-success-schema: AccountDetailEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
