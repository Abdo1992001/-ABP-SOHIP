post:
  tags: [AI]
  summary: Generate an external advisory
  operationId: post_ai_advisories_generate
  description: >-
    Permission: ai.advisory.view. Scope: Country. Uses OpenAI only when the
    server-side external AI integration is enabled; output is advisory only.
  security:
    - WebCookie: []
    - DesktopOAuth: []
  parameters:
    - $ref: ../components/parameters/CsrfToken.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/GenerateAdvisoryRequest.yaml
  responses:
    '201':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AdvisoryEnvelope.yaml
    '400': { $ref: ../components/responses/Error400.yaml }
    '401': { $ref: ../components/responses/Error401.yaml }
    '403': { $ref: ../components/responses/Error403.yaml }
    '404': { $ref: ../components/responses/Error404.yaml }
    '409': { $ref: ../components/responses/Error409.yaml }
    '412': { $ref: ../components/responses/Error412.yaml }
    '422': { $ref: ../components/responses/Error422.yaml }
    '429': { $ref: ../components/responses/Error429.yaml }
    '500': { $ref: ../components/responses/Error500.yaml }
    '503': { $ref: ../components/responses/Error503.yaml }
  x-abp-module: AI
  x-abp-permission: ai.advisory.view
  x-abp-scope-rule: Country
  x-abp-concurrency: NONE
  x-abp-idempotency: NONE
  x-abp-request-schema: GenerateAdvisoryRequest
  x-abp-success-schema: AdvisoryEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
