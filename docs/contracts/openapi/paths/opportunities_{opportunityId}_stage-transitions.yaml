post:
  tags:
    - Pipeline
  summary: Stage transition
  operationId: post_opportunities_by_opportunityId_stage_transitions
  description: >-
    Permission: opportunities.edit. Scope: effective Opportunity Country then
    Account context. LOST needs an active governed reason; WON snapshots
    value/time and reopening WON creates a reversal event.
  security:
    - WebCookie: []
    - DesktopOAuth: []
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/OpportunityEnvelope.yaml
      headers:
        ETag:
          $ref: ../components/headers/ETag.yaml
    '400':
      $ref: ../components/responses/Error400.yaml
    '401':
      $ref: ../components/responses/Error401.yaml
    '403':
      $ref: ../components/responses/Error403.yaml
    '404':
      $ref: ../components/responses/Error404.yaml
    '409':
      $ref: ../components/responses/Error409.yaml
    '412':
      $ref: ../components/responses/Error412.yaml
    '422':
      $ref: ../components/responses/Error422.yaml
    '429':
      $ref: ../components/responses/Error429.yaml
    '500':
      $ref: ../components/responses/Error500.yaml
    '503':
      $ref: ../components/responses/Error503.yaml
  parameters:
    - name: opportunityId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - $ref: ../components/parameters/IfMatch.yaml
    - $ref: ../components/parameters/IdempotencyKey.yaml
    - $ref: ../components/parameters/CsrfToken.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/OpportunityStageTransitionRequest.yaml
  x-abp-module: Pipeline
  x-abp-permission: opportunities.edit
  x-abp-scope-rule: Effective Opportunity country then Account context
  x-abp-concurrency: If-Match
  x-abp-idempotency: Required
  x-abp-request-schema: OpportunityStageTransitionRequest
  x-abp-success-schema: OpportunityEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
