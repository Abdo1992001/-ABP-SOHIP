get:
  tags:
    - Receivables
  summary: Receivable installments
  operationId: get_receivables
  description: 'Permission: payments.view. Installments owed on customer orders, by due date.'
  security:
    - WebCookie: []
    - DesktopOAuth: []
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ReceivableListEnvelope.yaml
    '400':
      $ref: ../components/responses/Error400.yaml
    '401':
      $ref: ../components/responses/Error401.yaml
    '403':
      $ref: ../components/responses/Error403.yaml
    '404':
      $ref: ../components/responses/Error404.yaml
    '409':
      $ref: ../components/responses/Error409.yaml
    '412':
      $ref: ../components/responses/Error412.yaml
    '422':
      $ref: ../components/responses/Error422.yaml
    '429':
      $ref: ../components/responses/Error429.yaml
    '500':
      $ref: ../components/responses/Error500.yaml
    '503':
      $ref: ../components/responses/Error503.yaml
  parameters:
    - name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
    - name: view
      in: query
      required: false
      schema:
        type: string
        enum: [OPEN, OVERDUE, DUE_SOON, NOT_SCHEDULED, SETTLED, ALL]
    - name: accountId
      in: query
      required: false
      schema:
        type: string
        format: uuid
    - name: customerOrderId
      in: query
      required: false
      schema:
        type: string
        format: uuid
    - name: search
      in: query
      required: false
      schema:
        type: string
        maxLength: 200
  x-abp-module: Receivables
  x-abp-permission: payments.view
  x-abp-scope-rule: Account access within country scope
  x-abp-concurrency: NONE
  x-abp-idempotency: NONE
  x-abp-request-schema: NONE
  x-abp-success-schema: ReceivableListEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
