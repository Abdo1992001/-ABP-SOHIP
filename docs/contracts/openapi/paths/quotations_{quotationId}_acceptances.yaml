post:
  tags:
    - Quotation
  summary: Record acceptance and transition linked Opportunity to WON consistently
  operationId: post_quotations_by_quotationId_acceptances
  description: 'Permission: quotations.accept. Scope: Quote scope. SENT quotation only.'
  security:
    - WebCookie: []
    - DesktopOAuth: []
  responses:
    '201':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AcceptanceResultEnvelope.yaml
    '400':
      $ref: ../components/responses/Error400.yaml
    '401':
      $ref: ../components/responses/Error401.yaml
    '403':
      $ref: ../components/responses/Error403.yaml
    '404':
      $ref: ../components/responses/Error404.yaml
    '409':
      $ref: ../components/responses/Error409.yaml
    '412':
      $ref: ../components/responses/Error412.yaml
    '422':
      $ref: ../components/responses/Error422.yaml
    '429':
      $ref: ../components/responses/Error429.yaml
    '500':
      $ref: ../components/responses/Error500.yaml
    '503':
      $ref: ../components/responses/Error503.yaml
  parameters:
    - name: quotationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - $ref: ../components/parameters/IdempotencyKey.yaml
    - $ref: ../components/parameters/CsrfToken.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CreateAcceptanceRequest.yaml
  x-abp-module: Quotation
  x-abp-permission: quotations.accept
  x-abp-scope-rule: Quote scope
  x-abp-concurrency: NONE
  x-abp-idempotency: Required
  x-abp-request-schema: CreateAcceptanceRequest
  x-abp-success-schema: AcceptanceEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
