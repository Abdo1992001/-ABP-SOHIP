get:
  tags:
    - Exports
  summary: Export status/download metadata
  operationId: get_exports_by_exportId
  description: 'Permission: exports.view. Scope: Creator/authorized. '
  security:
    - WebCookie: []
    - DesktopOAuth: []
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ExportJobEnvelope.yaml
    '400':
      $ref: ../components/responses/Error400.yaml
    '401':
      $ref: ../components/responses/Error401.yaml
    '403':
      $ref: ../components/responses/Error403.yaml
    '404':
      $ref: ../components/responses/Error404.yaml
    '409':
      $ref: ../components/responses/Error409.yaml
    '412':
      $ref: ../components/responses/Error412.yaml
    '422':
      $ref: ../components/responses/Error422.yaml
    '429':
      $ref: ../components/responses/Error429.yaml
    '500':
      $ref: ../components/responses/Error500.yaml
    '503':
      $ref: ../components/responses/Error503.yaml
  parameters:
    - name: exportId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  x-abp-module: Exports
  x-abp-permission: exports.view
  x-abp-scope-rule: Creator/authorized
  x-abp-concurrency: NONE
  x-abp-idempotency: NONE
  x-abp-request-schema: NONE
  x-abp-success-schema: ExportJobEnvelope
  x-abp-job-dto: true
  x-abp-execution-mode: ASYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
