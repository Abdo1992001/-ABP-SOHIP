get:
  tags:
    - Customer Orders
  summary: Customer order detail
  operationId: get_customer_orders_by_customerOrderId
  description: 'Permission: sales-orders.view.'
  security:
    - WebCookie: []
    - DesktopOAuth: []
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CustomerOrderEnvelope.yaml
      headers:
        ETag:
          $ref: ../components/headers/ETag.yaml
    '400':
      $ref: ../components/responses/Error400.yaml
    '401':
      $ref: ../components/responses/Error401.yaml
    '403':
      $ref: ../components/responses/Error403.yaml
    '404':
      $ref: ../components/responses/Error404.yaml
    '409':
      $ref: ../components/responses/Error409.yaml
    '412':
      $ref: ../components/responses/Error412.yaml
    '422':
      $ref: ../components/responses/Error422.yaml
    '429':
      $ref: ../components/responses/Error429.yaml
    '500':
      $ref: ../components/responses/Error500.yaml
    '503':
      $ref: ../components/responses/Error503.yaml
  parameters:
    - name: customerOrderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  x-abp-module: Customer Orders
  x-abp-permission: sales-orders.view
  x-abp-scope-rule: Account access within country scope
  x-abp-concurrency: NONE
  x-abp-idempotency: NONE
  x-abp-request-schema: NONE
  x-abp-success-schema: CustomerOrderEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
patch:
  tags:
    - Customer Orders
  summary: Amend a customer order
  operationId: patch_customer_orders_by_customerOrderId
  description: 'Permission: sales-orders.manage. Header and line quantities, before production, with a reason.'
  security:
    - WebCookie: []
    - DesktopOAuth: []
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CustomerOrderEnvelope.yaml
      headers:
        ETag:
          $ref: ../components/headers/ETag.yaml
    '400':
      $ref: ../components/responses/Error400.yaml
    '401':
      $ref: ../components/responses/Error401.yaml
    '403':
      $ref: ../components/responses/Error403.yaml
    '404':
      $ref: ../components/responses/Error404.yaml
    '409':
      $ref: ../components/responses/Error409.yaml
    '412':
      $ref: ../components/responses/Error412.yaml
    '422':
      $ref: ../components/responses/Error422.yaml
    '429':
      $ref: ../components/responses/Error429.yaml
    '500':
      $ref: ../components/responses/Error500.yaml
    '503':
      $ref: ../components/responses/Error503.yaml
  parameters:
    - name: customerOrderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - $ref: ../components/parameters/CsrfToken.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/AmendCustomerOrderRequest.yaml
  x-abp-module: Customer Orders
  x-abp-permission: sales-orders.manage
  x-abp-scope-rule: Account access within country scope
  x-abp-concurrency: expectedRowVersion
  x-abp-idempotency: NONE
  x-abp-request-schema: AmendCustomerOrderRequest
  x-abp-success-schema: CustomerOrderEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
