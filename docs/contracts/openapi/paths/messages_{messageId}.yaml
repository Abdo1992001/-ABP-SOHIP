get:
  tags: [Messages]
  summary: Read one authorized message
  operationId: get_messages_by_messageId
  security: [{ WebCookie: [] }, { DesktopOAuth: [] }]
  parameters: [{ name: messageId, in: path, required: true, schema: { type: string, format: uuid } }]
  responses:
    '200': { description: Success, content: { application/json: { schema: { $ref: ../components/schemas/MessageEnvelope.yaml } } } }
    '401': { $ref: ../components/responses/Error401.yaml }
    '404': { $ref: ../components/responses/Error404.yaml }
  x-abp-module: Messages
  x-abp-permission: authenticated
  x-abp-scope-rule: Active participant only
  x-abp-concurrency: NONE
  x-abp-idempotency: NONE
  x-abp-request-schema: NONE
  x-abp-success-schema: MessageEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
