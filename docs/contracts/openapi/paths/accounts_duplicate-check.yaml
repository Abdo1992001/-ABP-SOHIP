post:
  tags:
    - CRM
  summary: Rate-limited masked duplicate check
  operationId: post_accounts_duplicate_check
  description: >-
    Permission: accounts.create. Scope: Internal permissioned. Hidden matches
    expose no ID/name/owner/score.
  security:
    - WebCookie: []
    - DesktopOAuth: []
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/DuplicateCheckEnvelope.yaml
    '400':
      $ref: ../components/responses/Error400.yaml
    '401':
      $ref: ../components/responses/Error401.yaml
    '403':
      $ref: ../components/responses/Error403.yaml
    '404':
      $ref: ../components/responses/Error404.yaml
    '409':
      $ref: ../components/responses/Error409.yaml
    '412':
      $ref: ../components/responses/Error412.yaml
    '422':
      $ref: ../components/responses/Error422.yaml
    '429':
      $ref: ../components/responses/Error429.yaml
    '500':
      $ref: ../components/responses/Error500.yaml
    '503':
      $ref: ../components/responses/Error503.yaml
  parameters:
    - $ref: ../components/parameters/IdempotencyKey.yaml
    - $ref: ../components/parameters/CsrfToken.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/DuplicateCheckRequest.yaml
  x-abp-module: CRM
  x-abp-permission: accounts.create
  x-abp-scope-rule: Internal permissioned
  x-abp-concurrency: NONE
  x-abp-idempotency: Required
  x-abp-request-schema: DuplicateCheckRequest
  x-abp-success-schema: DuplicateCheckEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
