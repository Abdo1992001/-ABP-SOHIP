get:
  tags:
    - Customer Feedback
  summary: Customer feedback
  operationId: get_customer_feedback
  description: 'Permission: feedback.view. Newest first.'
  security:
    - WebCookie: []
    - DesktopOAuth: []
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/FeedbackListEnvelope.yaml
    '400':
      $ref: ../components/responses/Error400.yaml
    '401':
      $ref: ../components/responses/Error401.yaml
    '403':
      $ref: ../components/responses/Error403.yaml
    '404':
      $ref: ../components/responses/Error404.yaml
    '409':
      $ref: ../components/responses/Error409.yaml
    '412':
      $ref: ../components/responses/Error412.yaml
    '422':
      $ref: ../components/responses/Error422.yaml
    '429':
      $ref: ../components/responses/Error429.yaml
    '500':
      $ref: ../components/responses/Error500.yaml
    '503':
      $ref: ../components/responses/Error503.yaml
  parameters:
    - name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
    - name: status
      in: query
      required: false
      schema:
        type: string
        enum: [NEW, ACKNOWLEDGED, CONTACTED, CLOSED]
    - name: kind
      in: query
      required: false
      schema:
        type: string
        enum: [SATISFACTION, PROBLEM, SUGGESTION, QUESTION]
    - name: critical
      in: query
      required: false
      schema:
        type: string
        enum: ['true', 'false']
    - name: mine
      in: query
      required: false
      schema:
        type: string
        enum: ['true', 'false']
    - name: unmatched
      in: query
      required: false
      schema:
        type: string
        enum: ['true', 'false']
    - name: accountId
      in: query
      required: false
      schema:
        type: string
        format: uuid
    - name: search
      in: query
      required: false
      schema:
        type: string
        maxLength: 200
  x-abp-module: Customer Feedback
  x-abp-permission: feedback.view
  x-abp-scope-rule: Own customers and routed feedback; managers see the country
  x-abp-concurrency: NONE
  x-abp-idempotency: NONE
  x-abp-request-schema: NONE
  x-abp-success-schema: FeedbackListEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
