get:
  tags:
    - Quotation
  summary: Quote grid
  operationId: get_quotations
  description: "Permission: quotations.view. Scope: Country + account/share. "
  security:
    - WebCookie: []
    - DesktopOAuth: []
  responses:
    "200":
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/QuotationListEnvelope.yaml
    "400":
      $ref: ../components/responses/Error400.yaml
    "401":
      $ref: ../components/responses/Error401.yaml
    "403":
      $ref: ../components/responses/Error403.yaml
    "404":
      $ref: ../components/responses/Error404.yaml
    "409":
      $ref: ../components/responses/Error409.yaml
    "412":
      $ref: ../components/responses/Error412.yaml
    "422":
      $ref: ../components/responses/Error422.yaml
    "429":
      $ref: ../components/responses/Error429.yaml
    "500":
      $ref: ../components/responses/Error500.yaml
    "503":
      $ref: ../components/responses/Error503.yaml
  parameters:
    - $ref: ../components/parameters/Page.yaml
    - $ref: ../components/parameters/Offset.yaml
    - $ref: ../components/parameters/Limit.yaml
    - $ref: ../components/parameters/Sort.yaml
    - $ref: ../components/parameters/Search.yaml
    - $ref: ../components/parameters/AccountFilter.yaml
  x-abp-module: Quotation
  x-abp-permission: quotations.view
  x-abp-scope-rule: Country + account/share
  x-abp-concurrency: NONE
  x-abp-idempotency: NONE
  x-abp-request-schema: QuotationListQuery
  x-abp-success-schema: QuotationListEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
  x-abp-pagination: OFFSET
post:
  tags:
    - Quotation
  summary: Atomically create and price a DRAFT quotation
  operationId: post_quotations
  description: "Permission: quotations.create. Scope: Opportunity/customer scope.
    Creates the header, calculated lines, totals, terms and audit evidence in one
    transaction. Any validation or pricing failure rolls the entire quotation
    back, so no empty numbered draft remains."
  security:
    - WebCookie: []
    - DesktopOAuth: []
  responses:
    "201":
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/QuotationEnvelope.yaml
    "400":
      $ref: ../components/responses/Error400.yaml
    "401":
      $ref: ../components/responses/Error401.yaml
    "403":
      $ref: ../components/responses/Error403.yaml
    "404":
      $ref: ../components/responses/Error404.yaml
    "409":
      $ref: ../components/responses/Error409.yaml
    "412":
      $ref: ../components/responses/Error412.yaml
    "422":
      $ref: ../components/responses/Error422.yaml
    "429":
      $ref: ../components/responses/Error429.yaml
    "500":
      $ref: ../components/responses/Error500.yaml
    "503":
      $ref: ../components/responses/Error503.yaml
  parameters:
    - $ref: ../components/parameters/IdempotencyKey.yaml
    - $ref: ../components/parameters/CsrfToken.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CreateQuotationRequest.yaml
  x-abp-module: Quotation
  x-abp-permission: quotations.create
  x-abp-scope-rule: Opportunity/customer scope
  x-abp-concurrency: NONE
  x-abp-idempotency: Required
  x-abp-request-schema: CreateQuotationRequest
  x-abp-success-schema: QuotationEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
