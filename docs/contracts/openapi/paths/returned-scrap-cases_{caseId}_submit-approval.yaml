post:
  tags:
    - Returns
  summary: Freeze assessment and request mandatory Manager approval
  operationId: post_returned_scrap_cases_by_caseId_submit_approval
  description: 'Permission: returns.edit. Scope: Case scope. '
  security:
    - WebCookie: []
    - DesktopOAuth: []
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ReturnedScrapCaseEnvelope.yaml
      headers:
        ETag:
          $ref: ../components/headers/ETag.yaml
    '400':
      $ref: ../components/responses/Error400.yaml
    '401':
      $ref: ../components/responses/Error401.yaml
    '403':
      $ref: ../components/responses/Error403.yaml
    '404':
      $ref: ../components/responses/Error404.yaml
    '409':
      $ref: ../components/responses/Error409.yaml
    '412':
      $ref: ../components/responses/Error412.yaml
    '422':
      $ref: ../components/responses/Error422.yaml
    '429':
      $ref: ../components/responses/Error429.yaml
    '500':
      $ref: ../components/responses/Error500.yaml
    '503':
      $ref: ../components/responses/Error503.yaml
  parameters:
    - name: caseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - $ref: ../components/parameters/IdempotencyKey.yaml
    - $ref: ../components/parameters/CsrfToken.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/SubmitReturnedScrapApprovalRequest.yaml
  x-abp-module: Returns
  x-abp-permission: returns.edit
  x-abp-scope-rule: Case scope
  x-abp-concurrency: expectedRowVersion
  x-abp-idempotency: Required
  x-abp-request-schema: SubmitReturnedScrapApprovalRequest
  x-abp-success-schema: ReturnedScrapCaseEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
