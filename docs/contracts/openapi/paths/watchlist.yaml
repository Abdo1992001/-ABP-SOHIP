get:
  tags: [Commercial Intelligence]
  summary: List watchlist
  operationId: get_watchlist
  description: 'Permission: watchlist.view. Scope: Current user.'
  security:
    - WebCookie: []
    - DesktopOAuth: []
  parameters:
    - $ref: ../components/parameters/Page.yaml
    - $ref: ../components/parameters/Limit.yaml
    - $ref: ../components/parameters/Search.yaml
    - $ref: ../components/parameters/AccountCountryCode.yaml
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CommercialIntelligenceListEnvelope.yaml
    '400': { $ref: ../components/responses/Error400.yaml }
    '401': { $ref: ../components/responses/Error401.yaml }
    '403': { $ref: ../components/responses/Error403.yaml }
    '404': { $ref: ../components/responses/Error404.yaml }
    '409': { $ref: ../components/responses/Error409.yaml }
    '412': { $ref: ../components/responses/Error412.yaml }
    '422': { $ref: ../components/responses/Error422.yaml }
    '429': { $ref: ../components/responses/Error429.yaml }
    '500': { $ref: ../components/responses/Error500.yaml }
    '503': { $ref: ../components/responses/Error503.yaml }
  x-abp-module: Commercial Intelligence
  x-abp-permission: watchlist.view
  x-abp-scope-rule: Current user
  x-abp-concurrency: NONE
  x-abp-idempotency: NONE
  x-abp-request-schema: IntelligenceListQuery
  x-abp-success-schema: CommercialIntelligenceListEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
  x-abp-pagination: OFFSET
post:
  tags: [Commercial Intelligence]
  summary: Create watchlis
  operationId: post_watchlist
  description: 'Permission: watchlist.manage. Scope: Current user.'
  security:
    - WebCookie: []
    - DesktopOAuth: []
  parameters:
    - $ref: ../components/parameters/CsrfToken.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CreateWatchlistEntryRequest.yaml
  responses:
    '201':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CommercialIntelligenceEnvelope.yaml
    '400': { $ref: ../components/responses/Error400.yaml }
    '401': { $ref: ../components/responses/Error401.yaml }
    '403': { $ref: ../components/responses/Error403.yaml }
    '404': { $ref: ../components/responses/Error404.yaml }
    '409': { $ref: ../components/responses/Error409.yaml }
    '412': { $ref: ../components/responses/Error412.yaml }
    '422': { $ref: ../components/responses/Error422.yaml }
    '429': { $ref: ../components/responses/Error429.yaml }
    '500': { $ref: ../components/responses/Error500.yaml }
    '503': { $ref: ../components/responses/Error503.yaml }
  x-abp-module: Commercial Intelligence
  x-abp-permission: watchlist.manage
  x-abp-scope-rule: Current user
  x-abp-concurrency: NONE
  x-abp-idempotency: NONE
  x-abp-request-schema: CreateWatchlistEntryRequest
  x-abp-success-schema: CommercialIntelligenceEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
