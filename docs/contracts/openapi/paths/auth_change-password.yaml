post:
  tags: [Identity]
  summary: Change the current local user's password
  operationId: post_auth_change_password
  security: [{ WebCookie: [] }]
  parameters: [{ $ref: ../components/parameters/CsrfToken.yaml }]
  requestBody:
    required: true
    content:
      application/json:
        schema: { $ref: ../components/schemas/ChangePasswordRequest.yaml }
  responses:
    '200':
      description: Password changed and other sessions revoked
      content:
        application/json:
          schema: { $ref: ../components/schemas/PasswordChangeEnvelope.yaml }
    '400': { $ref: ../components/responses/Error400.yaml }
    '401': { $ref: ../components/responses/Error401.yaml }
    '403': { $ref: ../components/responses/Error403.yaml }
    '422': { $ref: ../components/responses/Error422.yaml }
    '500': { $ref: ../components/responses/Error500.yaml }
  x-abp-module: Identity
  x-abp-permission: authenticated
  x-abp-scope-rule: Self
  x-abp-concurrency: NONE
  x-abp-idempotency: NONE
  x-abp-request-schema: ChangePasswordRequest
  x-abp-success-schema: PasswordChangeEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
