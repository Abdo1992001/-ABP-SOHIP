get:
  tags:
    - Projects
  summary: Project grid
  operationId: get_projects
  description: 'Permission: projects.view. Scope: Country + authorized context. '
  security:
    - WebCookie: []
    - DesktopOAuth: []
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ProjectListEnvelope.yaml
    '400':
      $ref: ../components/responses/Error400.yaml
    '401':
      $ref: ../components/responses/Error401.yaml
    '403':
      $ref: ../components/responses/Error403.yaml
    '404':
      $ref: ../components/responses/Error404.yaml
    '409':
      $ref: ../components/responses/Error409.yaml
    '412':
      $ref: ../components/responses/Error412.yaml
    '422':
      $ref: ../components/responses/Error422.yaml
    '429':
      $ref: ../components/responses/Error429.yaml
    '500':
      $ref: ../components/responses/Error500.yaml
    '503':
      $ref: ../components/responses/Error503.yaml
  parameters:
    - $ref: ../components/parameters/Page.yaml
    - $ref: ../components/parameters/Offset.yaml
    - $ref: ../components/parameters/Limit.yaml
    - $ref: ../components/parameters/Sort.yaml
    - $ref: ../components/parameters/Search.yaml
    - name: accountId
      in: query
      required: false
      schema:
        $ref: ../components/schemas/UUID.yaml
      description: Return Projects where this Account is an authorized party.
    - name: countryCode
      in: query
      required: false
      schema:
        $ref: ../components/schemas/CountryCode.yaml
    - name: archiveState
      in: query
      required: false
      schema:
        type: string
        enum: [ACTIVE, ARCHIVED, ALL]
        default: ACTIVE
    - name: stageCode
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 100
  x-abp-module: Projects
  x-abp-permission: projects.view
  x-abp-scope-rule: Country + authorized context
  x-abp-concurrency: NONE
  x-abp-idempotency: NONE
  x-abp-request-schema: ProjectListQuery
  x-abp-success-schema: ProjectListEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
  x-abp-pagination: OFFSET
post:
  tags:
    - Projects
  summary: Create project
  operationId: post_projects
  description: >-
    Permission: projects.create. Scope: Country + party account access.
    Qualified project includes primary party.
  security:
    - WebCookie: []
    - DesktopOAuth: []
  responses:
    '201':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ProjectEnvelope.yaml
      headers:
        ETag:
          $ref: ../components/headers/ETag.yaml
    '400':
      $ref: ../components/responses/Error400.yaml
    '401':
      $ref: ../components/responses/Error401.yaml
    '403':
      $ref: ../components/responses/Error403.yaml
    '404':
      $ref: ../components/responses/Error404.yaml
    '409':
      $ref: ../components/responses/Error409.yaml
    '412':
      $ref: ../components/responses/Error412.yaml
    '422':
      $ref: ../components/responses/Error422.yaml
    '429':
      $ref: ../components/responses/Error429.yaml
    '500':
      $ref: ../components/responses/Error500.yaml
    '503':
      $ref: ../components/responses/Error503.yaml
  parameters:
    - $ref: ../components/parameters/IdempotencyKey.yaml
    - $ref: ../components/parameters/CsrfToken.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CreateProjectRequest.yaml
  x-abp-module: Projects
  x-abp-permission: projects.create
  x-abp-scope-rule: Country + party account access
  x-abp-concurrency: NONE
  x-abp-idempotency: Required
  x-abp-request-schema: CreateProjectRequest
  x-abp-success-schema: ProjectEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
