get:
  tags:
    - Identity
  summary: List users
  operationId: get_admin_users
  description: 'Permission: users.view. Scope: Admin scope. No business customer data.'
  security:
    - WebCookie: []
    - DesktopOAuth: []
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/UserListEnvelope.yaml
    '400':
      $ref: ../components/responses/Error400.yaml
    '401':
      $ref: ../components/responses/Error401.yaml
    '403':
      $ref: ../components/responses/Error403.yaml
    '404':
      $ref: ../components/responses/Error404.yaml
    '409':
      $ref: ../components/responses/Error409.yaml
    '412':
      $ref: ../components/responses/Error412.yaml
    '422':
      $ref: ../components/responses/Error422.yaml
    '429':
      $ref: ../components/responses/Error429.yaml
    '500':
      $ref: ../components/responses/Error500.yaml
    '503':
      $ref: ../components/responses/Error503.yaml
  parameters:
    - $ref: ../components/parameters/Page.yaml
    - $ref: ../components/parameters/Offset.yaml
    - $ref: ../components/parameters/Limit.yaml
    - $ref: ../components/parameters/Sort.yaml
    - $ref: ../components/parameters/Search.yaml
  x-abp-module: Identity
  x-abp-permission: users.view
  x-abp-scope-rule: Admin scope
  x-abp-concurrency: NONE
  x-abp-idempotency: NONE
  x-abp-request-schema: UserListQuery
  x-abp-success-schema: UserListEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
  x-abp-pagination: OFFSET
post:
  tags:
    - Identity
  summary: Admin creates an active user account with a temporary password
  operationId: post_admin_users
  description: >-
    Permission: users.create. Scope: Admin scope. Also reachable via
    POST /admin/access-requests/{requestId}/approve for requests submitted
    through POST /auth/request-access.
  security:
    - WebCookie: []
    - DesktopOAuth: []
  responses:
    '201':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CreateUserEnvelope.yaml
    '400':
      $ref: ../components/responses/Error400.yaml
    '401':
      $ref: ../components/responses/Error401.yaml
    '403':
      $ref: ../components/responses/Error403.yaml
    '404':
      $ref: ../components/responses/Error404.yaml
    '409':
      $ref: ../components/responses/Error409.yaml
    '412':
      $ref: ../components/responses/Error412.yaml
    '422':
      $ref: ../components/responses/Error422.yaml
    '429':
      $ref: ../components/responses/Error429.yaml
    '500':
      $ref: ../components/responses/Error500.yaml
    '503':
      $ref: ../components/responses/Error503.yaml
  parameters:
    - $ref: ../components/parameters/IdempotencyKey.yaml
    - $ref: ../components/parameters/CsrfToken.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CreateUserRequest.yaml
  x-abp-module: Identity
  x-abp-permission: users.create
  x-abp-scope-rule: Admin scope
  x-abp-concurrency: NONE
  x-abp-idempotency: Required
  x-abp-request-schema: CreateUserRequest
  x-abp-success-schema: CreateUserEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
