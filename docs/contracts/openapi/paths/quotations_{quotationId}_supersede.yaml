post:
  tags:
    - Quotation
  summary: Create a new DRAFT from a sent or historical quotation
  operationId: post_quotations_by_quotationId_supersede
  description: >-
    Permission: quotations.create. Scope: Source quote scope. A SENT source is
    closed as SUPERSEDED. EXPIRED, REJECTED, CANCELLED, and SUPERSEDED sources
    keep their historical status. The new quotation receives a new reference
    and links to its source.
  security:
    - WebCookie: []
    - DesktopOAuth: []
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/QuotationEnvelope.yaml
      headers:
        ETag:
          $ref: ../components/headers/ETag.yaml
    '400':
      $ref: ../components/responses/Error400.yaml
    '401':
      $ref: ../components/responses/Error401.yaml
    '403':
      $ref: ../components/responses/Error403.yaml
    '404':
      $ref: ../components/responses/Error404.yaml
    '409':
      $ref: ../components/responses/Error409.yaml
    '412':
      $ref: ../components/responses/Error412.yaml
    '422':
      $ref: ../components/responses/Error422.yaml
    '429':
      $ref: ../components/responses/Error429.yaml
    '500':
      $ref: ../components/responses/Error500.yaml
    '503':
      $ref: ../components/responses/Error503.yaml
  parameters:
    - name: quotationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - $ref: ../components/parameters/IdempotencyKey.yaml
    - $ref: ../components/parameters/CsrfToken.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/SupersedeQuotationRequest.yaml
  x-abp-module: Quotation
  x-abp-permission: quotations.create
  x-abp-scope-rule: Source quote scope
  x-abp-concurrency: expectedRowVersion
  x-abp-idempotency: Required
  x-abp-request-schema: SupersedeQuotationRequest
  x-abp-success-schema: QuotationEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
