get:
  tags:
    - ERP Orders
  summary: Canonical ERP order facts
  operationId: get_sales_orders
  description: "Permission: sales-orders.view. Scope: Country + account scope. Read-only."
  security:
    - WebCookie: []
    - DesktopOAuth: []
  responses:
    "200":
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/SalesOrderListEnvelope.yaml
    "400":
      $ref: ../components/responses/Error400.yaml
    "401":
      $ref: ../components/responses/Error401.yaml
    "403":
      $ref: ../components/responses/Error403.yaml
    "404":
      $ref: ../components/responses/Error404.yaml
    "409":
      $ref: ../components/responses/Error409.yaml
    "412":
      $ref: ../components/responses/Error412.yaml
    "422":
      $ref: ../components/responses/Error422.yaml
    "429":
      $ref: ../components/responses/Error429.yaml
    "500":
      $ref: ../components/responses/Error500.yaml
    "503":
      $ref: ../components/responses/Error503.yaml
  parameters:
    - $ref: ../components/parameters/Page.yaml
    - $ref: ../components/parameters/Offset.yaml
    - $ref: ../components/parameters/Limit.yaml
    - $ref: ../components/parameters/Sort.yaml
    - $ref: ../components/parameters/Search.yaml
    - $ref: ../components/parameters/AccountFilter.yaml
    - $ref: ../components/parameters/SalesOrderStatus.yaml
    - $ref: ../components/parameters/SalesOrderCountry.yaml
    - $ref: ../components/parameters/SalesOrderRelationship.yaml
    - $ref: ../components/parameters/SalesOrderDateFrom.yaml
    - $ref: ../components/parameters/SalesOrderDateTo.yaml
  x-abp-module: ERP Orders
  x-abp-permission: sales-orders.view
  x-abp-scope-rule: Country + account scope
  x-abp-concurrency: NONE
  x-abp-idempotency: NONE
  x-abp-request-schema: SalesOrderListQuery
  x-abp-success-schema: SalesOrderListEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
  x-abp-pagination: OFFSET
