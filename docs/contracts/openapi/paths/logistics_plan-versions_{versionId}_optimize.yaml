post:
  tags:
    - Logistics
  summary: Start optimizer run against frozen exact input hash
  operationId: post_logistics_plan_versions_by_versionId_optimize
  description: 'Permission: logistics.optimize. Scope: Plan scope. Async-capable.'
  security:
    - WebCookie: []
    - DesktopOAuth: []
  responses:
    '202':
      description: Accepted
      content:
        application/json:
          schema:
            $ref: ../components/schemas/OptimizerRunEnvelope.yaml
      headers:
        ETag:
          $ref: ../components/headers/ETag.yaml
    '400':
      $ref: ../components/responses/Error400.yaml
    '401':
      $ref: ../components/responses/Error401.yaml
    '403':
      $ref: ../components/responses/Error403.yaml
    '404':
      $ref: ../components/responses/Error404.yaml
    '409':
      $ref: ../components/responses/Error409.yaml
    '412':
      $ref: ../components/responses/Error412.yaml
    '422':
      $ref: ../components/responses/Error422.yaml
    '429':
      $ref: ../components/responses/Error429.yaml
    '500':
      $ref: ../components/responses/Error500.yaml
    '503':
      $ref: ../components/responses/Error503.yaml
  parameters:
    - name: versionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - $ref: ../components/parameters/IdempotencyKey.yaml
    - $ref: ../components/parameters/CsrfToken.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/OptimizePlanRequest.yaml
  x-abp-module: Logistics
  x-abp-permission: logistics.optimize
  x-abp-scope-rule: Plan scope
  x-abp-concurrency: expectedRowVersion
  x-abp-idempotency: Required
  x-abp-request-schema: OptimizePlanRequest
  x-abp-success-schema: JobEnvelope
  x-abp-job-dto: true
  x-abp-execution-mode: ASYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
