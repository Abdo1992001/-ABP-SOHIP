post:
  tags:
    - Quotation
  summary: Validate readiness and queue the approved official document
  operationId: post_quotations_by_quotationId_prepare
  description: >-
    Permission: quotations.edit. Scope: Quote/customer scope. Stays DRAFT while
    approval unresolved.
  security:
    - WebCookie: []
    - DesktopOAuth: []
  responses:
    '202':
      description: Readiness evaluated; approved immutable content is queued for rendering
      content:
        application/json:
          schema:
            $ref: ../components/schemas/PrepareQuotationEnvelope.yaml
      headers:
        ETag:
          $ref: ../components/headers/ETag.yaml
    '400':
      $ref: ../components/responses/Error400.yaml
    '401':
      $ref: ../components/responses/Error401.yaml
    '403':
      $ref: ../components/responses/Error403.yaml
    '404':
      $ref: ../components/responses/Error404.yaml
    '409':
      $ref: ../components/responses/Error409.yaml
    '412':
      $ref: ../components/responses/Error412.yaml
    '422':
      $ref: ../components/responses/Error422.yaml
    '429':
      $ref: ../components/responses/Error429.yaml
    '500':
      $ref: ../components/responses/Error500.yaml
    '503':
      $ref: ../components/responses/Error503.yaml
  parameters:
    - name: quotationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - $ref: ../components/parameters/IdempotencyKey.yaml
    - $ref: ../components/parameters/CsrfToken.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/PrepareQuotationRequest.yaml
  x-abp-module: Quotation
  x-abp-permission: quotations.edit
  x-abp-scope-rule: Quote/customer scope
  x-abp-concurrency: expectedRowVersion
  x-abp-idempotency: Required
  x-abp-request-schema: PrepareQuotationRequest
  x-abp-success-schema: PrepareQuotationEnvelope
  x-abp-job-dto: true
  x-abp-execution-mode: ASYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
