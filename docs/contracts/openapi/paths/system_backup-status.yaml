get:
  tags: [System]
  summary: Backup status
  operationId: get_system_backup_status
  description: 'What the backup service recorded after its last run: when, how big, and whether the copy restored.'
  security:
    - WebCookie: []
    - DesktopOAuth: []
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema: { $ref: ../components/schemas/SystemBackupEnvelope.yaml }
    '401': { $ref: ../components/responses/Error401.yaml }
    '403': { $ref: ../components/responses/Error403.yaml }
    '422': { $ref: ../components/responses/Error422.yaml }
    '429': { $ref: ../components/responses/Error429.yaml }
    '500': { $ref: ../components/responses/Error500.yaml }
  x-abp-module: System
  x-abp-permission: users.manage
  x-abp-scope-rule: System-wide
  x-abp-concurrency: NONE
  x-abp-idempotency: NONE
  x-abp-request-schema: NONE
  x-abp-success-schema: SystemBackupEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
