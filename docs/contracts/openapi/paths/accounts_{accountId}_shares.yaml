get:
  tags:
    - CRM
  summary: List/manage customer shares
  operationId: get_accounts_by_accountId_shares
  description: >-
    Permission: accounts.share. Scope: Owner/manage-share. Recipient sees only
    own grant via separate projection if needed.
  security:
    - WebCookie: []
    - DesktopOAuth: []
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CustomerShareListEnvelope.yaml
    '400':
      $ref: ../components/responses/Error400.yaml
    '401':
      $ref: ../components/responses/Error401.yaml
    '403':
      $ref: ../components/responses/Error403.yaml
    '404':
      $ref: ../components/responses/Error404.yaml
    '409':
      $ref: ../components/responses/Error409.yaml
    '412':
      $ref: ../components/responses/Error412.yaml
    '422':
      $ref: ../components/responses/Error422.yaml
    '429':
      $ref: ../components/responses/Error429.yaml
    '500':
      $ref: ../components/responses/Error500.yaml
    '503':
      $ref: ../components/responses/Error503.yaml
  parameters:
    - name: accountId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - $ref: ../components/parameters/Page.yaml
    - $ref: ../components/parameters/Offset.yaml
    - $ref: ../components/parameters/Limit.yaml
    - $ref: ../components/parameters/Sort.yaml
    - $ref: ../components/parameters/Search.yaml
  x-abp-module: CRM
  x-abp-permission: accounts.share
  x-abp-scope-rule: Owner/manage-share
  x-abp-concurrency: NONE
  x-abp-idempotency: NONE
  x-abp-request-schema: NONE
  x-abp-success-schema: CustomerShareListEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
  x-abp-pagination: OFFSET
post:
  tags:
    - CRM
  summary: Share customer
  operationId: post_accounts_by_accountId_shares
  description: >-
    Permission: accounts.share. Scope: Owner/manage-share + recipient country.
    No re-share by recipient default.
  security:
    - WebCookie: []
    - DesktopOAuth: []
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CustomerShareEnvelope.yaml
    '400':
      $ref: ../components/responses/Error400.yaml
    '401':
      $ref: ../components/responses/Error401.yaml
    '403':
      $ref: ../components/responses/Error403.yaml
    '404':
      $ref: ../components/responses/Error404.yaml
    '409':
      $ref: ../components/responses/Error409.yaml
    '412':
      $ref: ../components/responses/Error412.yaml
    '422':
      $ref: ../components/responses/Error422.yaml
    '429':
      $ref: ../components/responses/Error429.yaml
    '500':
      $ref: ../components/responses/Error500.yaml
    '503':
      $ref: ../components/responses/Error503.yaml
  parameters:
    - name: accountId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - $ref: ../components/parameters/IdempotencyKey.yaml
    - $ref: ../components/parameters/CsrfToken.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CreateCustomerShareRequest.yaml
  x-abp-module: CRM
  x-abp-permission: accounts.share
  x-abp-scope-rule: Owner/manage-share + recipient country
  x-abp-concurrency: NONE
  x-abp-idempotency: Required
  x-abp-request-schema: CreateCustomerShareRequest
  x-abp-success-schema: CustomerShareEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
