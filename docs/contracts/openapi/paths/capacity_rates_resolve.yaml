get:
  tags:
    - Capacity
  summary: Resolve effective rate by category/time
  operationId: get_capacity_rates_resolve
  description: 'Permission: capacity.view. Scope: Authorized. '
  security:
    - WebCookie: []
    - DesktopOAuth: []
  parameters:
    - name: categoryCode
      in: query
      required: true
      schema:
        type: string
        enum: [STANDARD, ORDINARY, CURVED]
    - name: effectiveAt
      in: query
      required: false
      schema:
        type: string
        format: date-time
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CapacityRateEnvelope.yaml
    '400':
      $ref: ../components/responses/Error400.yaml
    '401':
      $ref: ../components/responses/Error401.yaml
    '403':
      $ref: ../components/responses/Error403.yaml
    '404':
      $ref: ../components/responses/Error404.yaml
    '409':
      $ref: ../components/responses/Error409.yaml
    '412':
      $ref: ../components/responses/Error412.yaml
    '422':
      $ref: ../components/responses/Error422.yaml
    '429':
      $ref: ../components/responses/Error429.yaml
    '500':
      $ref: ../components/responses/Error500.yaml
    '503':
      $ref: ../components/responses/Error503.yaml
  x-abp-module: Capacity
  x-abp-permission: capacity.view
  x-abp-scope-rule: Authorized
  x-abp-concurrency: NONE
  x-abp-idempotency: NONE
  x-abp-request-schema: CapacityRateResolveQuery
  x-abp-success-schema: CapacityRateEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
