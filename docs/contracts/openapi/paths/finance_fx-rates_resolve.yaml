get:
  tags:
    - Finance FX
  summary: Resolve effective FX
  operationId: get_finance_fx_rates_resolve
  description: >-
    Permission: finance.fx.view or internal pricing service. Scope: FX
    permission/context. 
  security:
    - WebCookie: []
    - DesktopOAuth: []
  parameters:
    - name: baseCurrencyCode
      in: query
      schema:
        type: string
        const: USD
        default: USD
    - name: quoteCurrencyCode
      in: query
      schema:
        type: string
        const: EGP
        default: EGP
    - name: effectiveAt
      in: query
      schema:
        type: string
        format: date-time
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/FxRateEnvelope.yaml
    '400':
      $ref: ../components/responses/Error400.yaml
    '401':
      $ref: ../components/responses/Error401.yaml
    '403':
      $ref: ../components/responses/Error403.yaml
    '404':
      $ref: ../components/responses/Error404.yaml
    '409':
      $ref: ../components/responses/Error409.yaml
    '412':
      $ref: ../components/responses/Error412.yaml
    '422':
      $ref: ../components/responses/Error422.yaml
    '429':
      $ref: ../components/responses/Error429.yaml
    '500':
      $ref: ../components/responses/Error500.yaml
    '503':
      $ref: ../components/responses/Error503.yaml
  x-abp-module: Finance FX
  x-abp-permission: finance.fx.view or internal pricing service
  x-abp-scope-rule: FX permission/context
  x-abp-concurrency: NONE
  x-abp-idempotency: NONE
  x-abp-request-schema: FxResolveQuery
  x-abp-success-schema: FxRateEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
