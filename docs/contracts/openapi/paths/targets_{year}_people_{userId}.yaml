put:
  tags:
    - Targets
  summary: Set one salesperson's annual target
  operationId: put_targets_by_year_people_by_user_id
  description: 'Permission: targets.manage. Scope: Management. EGP. A null amount clears the person''s target.'
  security:
    - WebCookie: []
    - DesktopOAuth: []
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/PersonTargetEnvelope.yaml
    '400':
      $ref: ../components/responses/Error400.yaml
    '401':
      $ref: ../components/responses/Error401.yaml
    '403':
      $ref: ../components/responses/Error403.yaml
    '404':
      $ref: ../components/responses/Error404.yaml
    '409':
      $ref: ../components/responses/Error409.yaml
    '412':
      $ref: ../components/responses/Error412.yaml
    '422':
      $ref: ../components/responses/Error422.yaml
    '429':
      $ref: ../components/responses/Error429.yaml
    '500':
      $ref: ../components/responses/Error500.yaml
    '503':
      $ref: ../components/responses/Error503.yaml
  parameters:
    - name: year
      in: path
      required: true
      schema:
        type: string
        format: string
    - name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - $ref: ../components/parameters/CsrfToken.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/SetPersonTargetRequest.yaml
  x-abp-module: Targets
  x-abp-permission: targets.manage
  x-abp-scope-rule: Management
  x-abp-concurrency: NONE
  x-abp-idempotency: NONE
  x-abp-request-schema: SetPersonTargetRequest
  x-abp-success-schema: PersonTargetEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
