post:
  tags: [Activities]
  summary: Cancel task/follow-up
  operationId: post_activities_by_activityId_cancel
  description: 'Permission: activities.cancel. Scope: Country + inherited linked-resource context. Cancellation is a lifecycle command, not PATCH.'
  security: [{ WebCookie: [] }, { DesktopOAuth: [] }]
  parameters:
    - name: activityId
      in: path
      required: true
      schema: { type: string, format: uuid }
    - $ref: ../components/parameters/IfMatch.yaml
    - $ref: ../components/parameters/IdempotencyKey.yaml
    - $ref: ../components/parameters/CsrfToken.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema: { $ref: ../components/schemas/CancelActivityRequest.yaml }
  responses:
    '200':
      description: Success
      headers: { ETag: { $ref: ../components/headers/ETag.yaml } }
      content:
        application/json:
          schema: { $ref: ../components/schemas/ActivityEnvelope.yaml }
    '400': { $ref: ../components/responses/Error400.yaml }
    '401': { $ref: ../components/responses/Error401.yaml }
    '403': { $ref: ../components/responses/Error403.yaml }
    '404': { $ref: ../components/responses/Error404.yaml }
    '409': { $ref: ../components/responses/Error409.yaml }
    '412': { $ref: ../components/responses/Error412.yaml }
    '422': { $ref: ../components/responses/Error422.yaml }
    '429': { $ref: ../components/responses/Error429.yaml }
    '500': { $ref: ../components/responses/Error500.yaml }
    '503': { $ref: ../components/responses/Error503.yaml }
  x-abp-module: Activities
  x-abp-permission: activities.cancel
  x-abp-scope-rule: Country + inherited linked-resource context
  x-abp-concurrency: If-Match
  x-abp-idempotency: Required
  x-abp-request-schema: CancelActivityRequest
  x-abp-success-schema: ActivityEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
