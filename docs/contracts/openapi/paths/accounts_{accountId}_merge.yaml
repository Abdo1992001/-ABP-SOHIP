post:
  tags:
    - CRM
  summary: Execute authorized merge
  operationId: post_accounts_by_accountId_merge
  description: >-
    Permission: accounts.merge + accounts.merge.approve. Sales Manager approval
    required. Atomic;
    merged source archived.
  security:
    - WebCookie: []
    - DesktopOAuth: []
  responses:
    '200':
      description: Success
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AccountDetailEnvelope.yaml
    '400':
      $ref: ../components/responses/Error400.yaml
    '401':
      $ref: ../components/responses/Error401.yaml
    '403':
      $ref: ../components/responses/Error403.yaml
    '404':
      $ref: ../components/responses/Error404.yaml
    '409':
      $ref: ../components/responses/Error409.yaml
    '412':
      $ref: ../components/responses/Error412.yaml
    '422':
      $ref: ../components/responses/Error422.yaml
    '429':
      $ref: ../components/responses/Error429.yaml
    '500':
      $ref: ../components/responses/Error500.yaml
    '503':
      $ref: ../components/responses/Error503.yaml
  parameters:
    - name: accountId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - $ref: ../components/parameters/IdempotencyKey.yaml
    - $ref: ../components/parameters/CsrfToken.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/MergeAccountRequest.yaml
  x-abp-module: CRM
  x-abp-permission: accounts.merge + accounts.merge.approve
  x-abp-scope-rule: Sales Manager approval + record access
  x-abp-concurrency: NONE
  x-abp-idempotency: Required
  x-abp-request-schema: MergeAccountRequest
  x-abp-success-schema: AccountDetailEnvelope
  x-abp-job-dto: false
  x-abp-execution-mode: SYNC
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
