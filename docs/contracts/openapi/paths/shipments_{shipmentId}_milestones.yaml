post:
  tags: [Logistics]
  summary: Append next shipment milestone
  operationId: post_shipments_by_shipmentId_milestones
  parameters: [{ name: shipmentId, in: path, required: true, schema: { type: string, format: uuid } }, { $ref: ../components/parameters/IdempotencyKey.yaml }]
  requestBody:
    required: true
    content: { application/json: { schema: { type: object, additionalProperties: false, required: [milestoneCode, businessOccurredAt, expectedRowVersion], properties: { milestoneCode: { type: string, enum: [SHIPPED, VESSEL_DEPARTED, ARRIVED_AT_PORT_OF_DISCHARGE] }, businessOccurredAt: { type: string, format: date-time }, expectedRowVersion: { type: string, pattern: '^\d+$' }, blDate: { type: string, format: date }, portOfDischarge: { type: string }, actualArrivalAt: { type: string, format: date-time } } } } }
  responses: { '200': { description: Recorded, content: { application/json: { schema: { $ref: ../components/schemas/ShipmentEnvelope.yaml } } } }, '400': { $ref: ../components/responses/Error400.yaml } }
  x-abp-module: Logistics
  x-abp-permission: shipments.edit
  x-abp-scope-rule: Country Scope and monotonic milestone transition
  x-abp-concurrency: expectedRowVersion
  x-abp-execution-mode: SYNC
  x-abp-job-dto: false
  x-implementation-status: IMPLEMENTED
  x-runtime-enabled: true
