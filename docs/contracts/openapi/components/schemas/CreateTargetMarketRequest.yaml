type: object
additionalProperties: false
required: [name, countryCode, rationale]
properties:
  name: { type: string, minLength: 2, maxLength: 240 }
  countryCode: { type: string, minLength: 2, maxLength: 2 }
  segmentCode: { type: string, maxLength: 100 }
  rationale: { type: string, minLength: 3, maxLength: 4000 }
  priorityScore: { type: number, minimum: 0, maximum: 100 }
  rankingSource: { type: string, maxLength: 120 }
