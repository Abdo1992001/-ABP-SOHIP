type: object
properties:
  data:
    type: array
    maxItems: 200
    items:
      type: object
      properties:
        customerOrderId:
          type: string
          format: uuid
        orderRef:
          type: string
        quotationId:
          type: string
          format: uuid
        quotationRef:
          type: [string, 'null']
        accountId:
          type: string
          format: uuid
        accountName:
          type: string
        statusCode:
          type: string
          enum: [DRAFT, CONFIRMED, IN_PRODUCTION, READY, HANDED_OVER, CLOSED, CANCELLED]
        currencyCode:
          type: string
        totalAmount:
          type: string
        rowVersion:
          type: string
      additionalProperties: true
      required:
        - customerOrderId
        - orderRef
        - statusCode
  meta:
    $ref: OffsetPaginationMeta.yaml
additionalProperties: false
required:
  - data
  - meta
