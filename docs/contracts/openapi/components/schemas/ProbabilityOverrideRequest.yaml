type: object
additionalProperties: false
required: [probabilityPct, reason, sourceMetadata]
properties:
  probabilityPct: { $ref: ./Percentage.yaml }
  reason: { type: string, minLength: 3, maxLength: 500 }
  sourceMetadata:
    type: object
    additionalProperties: false
    required: [sourceCode]
    properties:
      sourceCode: { type: string, minLength: 1, maxLength: 100 }
      reference: { type: [string, 'null'], maxLength: 300 }

