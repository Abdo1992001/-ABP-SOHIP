type: object
properties:
  contactId:
    type: string
    format: uuid
  accountId:
    type: string
    format: uuid
  displayName:
    type: string
  jobTitle:
    type:
      - string
      - 'null'
  statusCode:
    type: string
  rowVersion:
    $ref: ./RowVersion.yaml
  account:
    $ref: ./ContactAccountReference.yaml
  channels:
    type: array
    items:
      $ref: ./ContactChannel.yaml
additionalProperties: false
required:
  - contactId
  - accountId
  - displayName
  - statusCode
  - rowVersion
  - account
  - channels
