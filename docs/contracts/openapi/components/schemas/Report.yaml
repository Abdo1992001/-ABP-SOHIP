type: object
properties:
  reportCode:
    type: string
  generatedAt:
    type: string
    format: date-time
  currencyCode:
    type:
      - string
      - 'null'
  metrics:
    type: object
    additionalProperties:
      type:
        - string
        - number
        - integer
        - boolean
        - 'null'
  series:
    type: array
    items:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        value:
          type: string
          pattern: ^-?\d+(\.\d+)?$
        count:
          type:
            - integer
            - 'null'
          format: int64
      additionalProperties: false
      required:
        - key
        - label
        - value
additionalProperties: false
required:
  - reportCode
  - generatedAt
  - metrics
  - series
