type: object
additionalProperties: false
required:
  - projectId
  - projectRef
  - name
  - geography
  - primaryAccount
  - city
  - region
  - stageCode
  - commercialOwnerUserId
  - recordStatusCode
  - updatedAt
properties:
  projectId:
    $ref: ./UUID.yaml
  projectRef:
    type: string
    minLength: 1
    maxLength: 100
  name:
    type: string
    minLength: 1
    maxLength: 300
  geography:
    $ref: ./ProjectGeography.yaml
  primaryAccount:
    $ref: ./ProjectAccountReference.yaml
  city:
    type:
      - string
      - 'null'
    maxLength: 200
  region:
    type:
      - string
      - 'null'
    maxLength: 200
  stageCode:
    type:
      - string
      - 'null'
    maxLength: 100
  commercialOwnerUserId:
    $ref: ./UUID.yaml
  recordStatusCode:
    type: string
    enum: [ACTIVE, ARCHIVED]
  updatedAt:
    $ref: ./DateTime.yaml
description: Safe Project grid projection. Normalized search values and unrelated Customer internals are omitted.

