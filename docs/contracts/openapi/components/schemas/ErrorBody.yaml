type: object
additionalProperties: false
required:
  - code
  - messageKey
  - params
  - fieldErrors
  - ruleErrors
  - traceId
  - correlationId
  - conflict
properties:
  code:
    type: string
    minLength: 1
    maxLength: 100
  messageKey:
    type: string
    minLength: 1
    maxLength: 200
  params:
    $ref: ./ErrorParamMap.yaml
  fieldErrors:
    type: array
    maxItems: 100
    items:
      $ref: ./FieldError.yaml
  ruleErrors:
    type: array
    maxItems: 100
    items:
      $ref: ./RuleError.yaml
  traceId:
    $ref: ./TraceId.yaml
  correlationId:
    $ref: ./CorrelationId.yaml
  conflict:
    $ref: ./ConflictMetadata.yaml
