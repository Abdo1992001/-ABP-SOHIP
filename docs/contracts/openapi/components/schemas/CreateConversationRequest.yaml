type: object
additionalProperties: false
required: [typeCode, participantUserIds]
properties:
  typeCode: { type: string, enum: [DM, GROUP] }
  title: { type: string, minLength: 1, maxLength: 120 }
  participantUserIds:
    type: array
    minItems: 1
    maxItems: 49
    uniqueItems: true
    items: { type: string, format: uuid }
  businessContextType: { type: string, minLength: 1, maxLength: 80 }
  businessContextId: { type: string, format: uuid }
