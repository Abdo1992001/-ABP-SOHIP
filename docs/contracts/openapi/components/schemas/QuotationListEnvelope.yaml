type: object
properties:
  data:
    type: array
    items:
      type: object
      properties:
        quotationId:
          type: string
          format: uuid
          description: Standalone quotation.
        quoteRef:
          type: string
          description: Unique human quote number.
        supersedesQuotationId:
          type:
            - string
            - 'null'
          format: uuid
          description: Previous SENT quote replaced by this new quote.
        opportunityId:
          type: string
          format: uuid
          description: Opportunity.
        accountId:
          type: string
          format: uuid
          description: Customer.
        projectId:
          type:
            - string
            - 'null'
          format: uuid
          description: Project if applicable.
        contactId:
          type:
            - string
            - 'null'
          format: uuid
          description: Contact person at the customer this quotation was discussed with.
        countryCode:
          type: string
          description: Scope country snapshot.
        ownerUserId:
          type: string
          format: uuid
          description: Quote owner.
        statusCode:
          type: string
          description: DRAFT/READY/SENT/EXPIRED/CANCELLED only.
        documentTypeCode:
          type: string
          enum:
            - QUOTATION
            - PROFORMA_INVOICE
          description: Which official document template/numbering this quote renders as.
        incotermCode:
          type:
            - string
            - 'null'
          enum:
            - DDP
            - CIF
            - FOB
            - null
          description: Delivery terms, drives the delivery address shown on the official document.
        currencyCode:
          type: string
          description: Quote currency.
        fxRateId:
          type:
            - string
            - 'null'
          format: uuid
          description: Applied FX source at send if needed.
        fxRateSnapshot:
          type:
            - string
            - 'null'
          pattern: ^-?\d+(\.\d+)?$
          description: Immutable applied rate snapshot.
        calculationVersion:
          type: string
          description: Pricing/calculation engine version.
        validFrom:
          type:
            - string
            - 'null'
          format: date
          description: Validity start.
        expiresOn:
          type:
            - string
            - 'null'
          format: date
          description: Expiry date.
        paymentTermsSnapshot:
          type:
            - string
            - 'null'
          description: Client-facing terms snapshot.
        subtotalAmount:
          type: string
          pattern: ^-?\d+(\.\d+)?$
          description: Subtotal.
        discountAmount:
          type: string
          pattern: ^-?\d+(\.\d+)?$
          description: Total quote discount.
        taxAmount:
          type: string
          pattern: ^-?\d+(\.\d+)?$
          description: Tax.
        grandTotalAmount:
          type: string
          pattern: ^-?\d+(\.\d+)?$
          description: Final total.
        sentAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When quotation becomes immutable.
        rowVersion:
          $ref: ./RowVersion.yaml
          description: DRAFT concurrency.
        fxEffectiveAtSnapshot:
          type:
            - string
            - 'null'
          format: date-time
          description: Effective timestamp of applied FX rate captured at SENT.
        acceptedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the customer accepted it, from valid acceptance evidence.
        customerOrderId:
          type:
            - string
            - 'null'
          format: uuid
          description: The customer order booked from it, if any.
        orderRef:
          type:
            - string
            - 'null'
          description: That order's number.
      additionalProperties: false
      required:
        - accountId
        - calculationVersion
        - countryCode
        - currencyCode
        - documentTypeCode
        - incotermCode
        - opportunityId
        - ownerUserId
        - quotationId
  meta:
    $ref: ./PaginationMeta.yaml
  links:
    $ref: ./Links.yaml
additionalProperties: false
required:
  - data
  - meta
