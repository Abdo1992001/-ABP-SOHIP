type: object
additionalProperties: false
required:
  - status
  - timestamp
  - checks
properties:
  status:
    type: string
    enum:
      - UP
      - DOWN
      - DEGRADED
  timestamp:
    $ref: ./DateTime.yaml
  checks:
    type: array
    maxItems: 20
    items:
      type: object
      additionalProperties: false
      required:
        - name
        - status
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        status:
          type: string
          enum:
            - UP
            - DOWN
