type: object
additionalProperties: false
required:
  - accountId
  - accountRef
  - customerNumber
  - canonicalName
  - geography
  - hqCountry
  - accountCategoryCode
  - businessTypeCode
  - ownerUserId
  - defaultCurrencyCode
  - address
  - taxNumber
  - effectiveGroupMemberships
  - contacts
  - opportunities
  - quotations
  - activities
  - erpSyncStatus
  - recordStatusCode
  - archivedAt
  - rowVersion
properties:
  accountId:
    $ref: ./UUID.yaml
  accountRef:
    type: string
    minLength: 1
    maxLength: 100
  customerNumber:
    type:
      - string
      - 'null'
    maxLength: 100
  canonicalName:
    type: string
    minLength: 1
    maxLength: 300
  geography:
    $ref: ./AccountGeography.yaml
  hqCountry:
    oneOf:
      - $ref: ./CountryReference.yaml
      - type: 'null'
  accountCategoryCode:
    $ref: ./AccountCategoryCode.yaml
  businessTypeCode:
    $ref: ./AccountBusinessTypeCode.yaml
  ownerUserId:
    $ref: ./UUID.yaml
  defaultCurrencyCode:
    oneOf:
      - $ref: ./CurrencyCode.yaml
      - type: 'null'
  address:
    type:
      - string
      - 'null'
    maxLength: 500
    description: Postal address, as printed on the buyer block of a proforma invoice.
  taxNumber:
    type:
      - string
      - 'null'
    maxLength: 60
    description: Tax registration number — NIP in Poland, its equivalent elsewhere.
  effectiveGroupMemberships:
    type: array
    maxItems: 100
    items:
      $ref: ./EffectiveGroupMembershipSummary.yaml
  contacts:
    type: array
    maxItems: 100
    items:
      $ref: ./ContactListItem.yaml
  opportunities:
    type: array
    maxItems: 100
    items:
      $ref: ./OpportunityListItem.yaml
  quotations:
    type: array
    maxItems: 100
    items:
      $ref: ./Customer360QuotationSummary.yaml
  activities:
    type: array
    maxItems: 100
    items:
      $ref: ./Activity.yaml
  erpSyncStatus:
    $ref: ./ErpSyncStatus.yaml
  recordStatusCode:
    $ref: ./AccountRecordStatus.yaml
  archivedAt:
    type:
      - string
      - 'null'
    format: date-time
  rowVersion:
    $ref: ./RowVersion.yaml
description: Safe authorized Customer 360 base projection. Restricted/source diagnostics are omitted; backend policy selects projections before serialization.
