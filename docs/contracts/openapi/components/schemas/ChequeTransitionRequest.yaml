      - DEPOSITED
      - CLEARED
      - BOUNCED
      - CANCELLED
  expectedRowVersion:
    $ref: ./RowVersion.yaml
  reason:
    type:
      - string
      - 'null'
  evidenceDocumentId:
    type:
      - string
      - 'null'
