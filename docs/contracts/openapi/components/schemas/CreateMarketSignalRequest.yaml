type: object
additionalProperties: false
required: [title, sourceName, publishedDate, retrievedDate, evidence, verificationCode, classificationCode]
properties:
  title: { type: string, minLength: 2, maxLength: 240 }
  sourceName: { type: string, minLength: 2, maxLength: 200 }
  sourceUrl: { type: string, format: uri, maxLength: 2000 }
  publishedDate: { type: string, format: date }
  retrievedDate: { type: string, format: date }
  eventDate: { type: string, format: date }
  evidence: { type: string, minLength: 3, maxLength: 20000 }
  verificationCode: { type: string, enum: [VERIFIED, UNVERIFIED, REJECTED] }
  classificationCode: { type: string, enum: [FACT, FORECAST, OPINION, UNVERIFIED] }
  countryCode: { type: string, minLength: 2, maxLength: 2 }
  summary: { type: string, maxLength: 4000 }
