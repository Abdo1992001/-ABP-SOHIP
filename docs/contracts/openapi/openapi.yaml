  securitySchemes:
    WebCookie:
      type: apiKey
      in: cookie
      name: __Host-abp_session
      description: Secure HttpOnly SameSite cookie. State-changing browser requests
        also require CSRF protection.
    DesktopOAuth:
      type: oauth2
      description: Desktop OAuth 2.1 Authorization Code + PKCE through the system
        browser; token stored in OS secure credential store.
      flows:
        authorizationCode:
          authorizationUrl: /oauth/authorize
          tokenUrl: /oauth/token
          scopes: {}
    ExternalBffAssertion:
      type: apiKey
      in: header
      name: x-abp-bff-assertion
      description: Short-lived assertion issued only by the trusted BFF after
        Microsoft Entra External ID authentication. Issuer, subject and
        timestamp are signed; the application never accepts local portal
        passwords.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
x-abp-authorization-invariant:
  evaluationOrder:
    - ACTIVE_IDENTITY_SESSION
    - COUNTRY_SCOPE
    - RBAC_WORKSPACE_PERMISSION
    - EXPLICIT_DENY
    - RESOURCE_CONTEXT
    - FIELD_PROJECTION
    - WORKFLOW_STATE_RULES
  resourceContextMechanisms:
    - OWNERSHIP
    - CONFIGURED_DIRECT_MANAGER
    - EXPLICIT_SHARE
    - APPROVED_CONTEXT
  countryScopeCanBeWidened: false
  denyWins: true
  managerRelationshipRequired: true
  description: Ownership, manager relationships, sharing, and context are grants
    only inside already-effective Country Scope. Missing manager configuration
    never grants access. The backend omits unauthorized fields before
    serialization.
